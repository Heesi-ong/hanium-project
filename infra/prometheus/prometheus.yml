# Prometheus 설정입니다.
# backend 관리 포트(8081)의 /actuator/prometheus를 15초 간격으로 스크레이핑합니다.
# 알림 규칙은 alerts.yml에 정의되어 있습니다.

global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# firing된 알림을 Alertmanager로 전달합니다. (docker-compose.monitoring.yml의 alertmanager 서비스)
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  - job_name: blackbox-exporter
    static_configs:
      - targets: ['blackbox-exporter:9115']

  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8081']

  # 분석 실행 워커. 워커를 분리 배포하면 완료/실패/타임아웃/소요시간/큐 게이지 등 "실행"
  # 관련 지표는 backend가 아니라 이 워커가 방출하므로, 반드시 함께 스크레이프해야 대시보드와
  # 알림이 정확해집니다.
  # DNS 서비스 디스커버리를 사용해, `--scale analysis-worker=N`으로 워커를 늘리면 모든 복제본을
  # 자동으로 찾아 스크레이프합니다. (docker 내장 DNS가 서비스명 A 레코드로 모든 컨테이너 IP를
  # 반환) 워커를 띄우지 않는 단일 프로세스 모드라면 대상이 0개가 되어 조용히 무시됩니다.
  - job_name: analysis-worker
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ['analysis-worker']
        type: A
        port: 8081

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # 사용자 상태 페이지 방문 여부와 무관하게 엔진/MinIO의 공개 health를 지속 점검합니다.
  # 상세 readiness와 내부 API 키는 blackbox exporter에 전달하지 않습니다.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://analysis-engine:8001/health']
        labels:
          component: analysis-engine
      - targets: ['http://video-llm-engine:8002/health']
        labels:
          component: video-llm-engine
      - targets: ['http://minio:9000/minio/health/live']
        labels:
          component: minio
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # MySQL/Redis는 비밀값을 exporter에 복제하지 않고 TCP 연결 가능 여부만 확인합니다.
  # 쿼리·인증 수준의 상태는 backend Hikari/Redis 실패 메트릭과 함께 판단합니다.
  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ['mysql:3306']
        labels:
          component: mysql
      - targets: ['redis:6379']
        labels:
          component: redis
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
