# Prometheus 알림 규칙입니다.
# Alertmanager(infra/alertmanager/alertmanager.yml)와 연동되어 있어, firing된 알림은
# 설정된 이메일 수신자로 실제 발송됩니다. Prometheus UI(http://127.0.0.1:9090)의
# Alerts 탭에서도 firing 상태를 확인할 수 있습니다.

groups:
  - name: backend-alerts
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "backend가 응답하지 않습니다"
          description: "Prometheus가 backend(/actuator/prometheus)를 2분 이상 스크레이핑하지 못했습니다. 컨테이너 상태와 로그를 확인하세요."

      - alert: AnalysisJobFailureRateHigh
        # 최근 15분간 실패 증가량이 시작 증가량의 30%를 초과하면 발동합니다.
        # clamp_min으로 분모가 0일 때(시작된 작업이 없을 때) 나눗셈 오류를 막습니다.
        expr: increase(analysis_job_failed_total[15m]) / clamp_min(increase(analysis_job_started_total[15m]), 1) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "분석 작업 실패율이 높습니다"
          description: "최근 15분간 분석 작업 실패 비율이 30%를 초과한 상태가 5분 이상 지속되고 있습니다. analysis-engine/video-llm-engine/OpenAI 연동 상태를 확인하세요."

      - alert: OpenAiMonthlyBudgetNearExhaustion
        expr: openai_monthly_usage / clamp_min(openai_monthly_budget_capacity, 1) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OpenAI 월간 호출 한도 소진 임박"
          description: "이번 달 OpenAI 실제 API 호출량이 설정된 한도의 90%를 초과한 상태가 5분 이상 지속되고 있습니다. 한도 상향 또는 비용을 확인하세요."

      - alert: VideoLlmMonthlyBudgetNearExhaustion
        expr: video_llm_monthly_usage / clamp_min(video_llm_monthly_budget_capacity, 1) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Video LLM 월간 호출 한도 소진 임박"
          description: "이번 달 NVIDIA Video LLM 실제 API 호출량이 설정된 한도의 90%를 초과한 상태가 5분 이상 지속되고 있습니다. 한도 상향 또는 비용을 확인하세요."

  - name: host-alerts
    rules:
      - alert: HostDiskSpaceLow
        expr: node_filesystem_avail_bytes{job="node-exporter", mountpoint=~"/|/rootfs"} / clamp_min(node_filesystem_size_bytes{job="node-exporter", mountpoint=~"/|/rootfs"}, 1) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "호스트 디스크 여유 공간 부족"
          description: "호스트 루트 파일시스템의 여유 공간이 15% 미만인 상태가 10분 이상 지속되고 있습니다. storage 디렉터리와 백업/업로드 파일 사용량을 확인하세요."

      - alert: HostCpuLoadHigh
        expr: node_load1{job="node-exporter"} > (count without (cpu, mode) (node_cpu_seconds_total{job="node-exporter", mode="idle"}) * 1.5)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "호스트 CPU 부하가 높습니다"
          description: "호스트의 1분 평균 CPU 로드가 CPU 코어 수의 1.5배를 초과한 상태가 10분 이상 지속되고 있습니다. 어떤 컨테이너가 CPU를 많이 사용하는지 확인하세요."

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes{job="node-exporter"} / clamp_min(node_memory_MemTotal_bytes{job="node-exporter"}, 1) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "호스트 여유 메모리 부족"
          description: "호스트의 여유 메모리가 전체 메모리의 15% 미만인 상태가 10분 이상 지속되고 있습니다. 메모리 사용량이 높은 컨테이너와 프로세스를 확인하세요."
