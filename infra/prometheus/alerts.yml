# Prometheus 알림 규칙입니다.
# Alertmanager(infra/alertmanager/alertmanager.yml)와 연동되어 있어, firing된 알림은
# 설정된 이메일 수신자로 실제 발송됩니다. Prometheus UI(http://127.0.0.1:9090)의
# Alerts 탭에서도 firing 상태를 확인할 수 있습니다.

groups:
  - name: backend-alerts
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "backend가 응답하지 않습니다"
          description: "Prometheus가 backend(/actuator/prometheus)를 2분 이상 스크레이핑하지 못했습니다. 컨테이너 상태와 로그를 확인하세요."

      - alert: AnalysisJobFailureRateHigh
        # 최근 15분간 실패 증가량이 시작 증가량의 30%를 초과하면 발동합니다.
        # clamp_min으로 분모가 0일 때(시작된 작업이 없을 때) 나눗셈 오류를 막습니다.
        expr: increase(analysis_job_failed_total[15m]) / clamp_min(increase(analysis_job_started_total[15m]), 1) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "분석 작업 실패율이 높습니다"
          description: "최근 15분간 분석 작업 실패 비율이 30%를 초과한 상태가 5분 이상 지속되고 있습니다. analysis-engine/video-llm-engine/OpenAI 연동 상태를 확인하세요."

      - alert: OpenAiMonthlyBudgetNearExhaustion
        expr: openai_monthly_usage / clamp_min(openai_monthly_budget_capacity, 1) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OpenAI 월간 호출 한도 소진 임박"
          description: "이번 달 OpenAI 실제 API 호출량이 설정된 한도의 90%를 초과한 상태가 5분 이상 지속되고 있습니다. 한도 상향 또는 비용을 확인하세요."

      - alert: VideoLlmMonthlyBudgetNearExhaustion
        expr: video_llm_monthly_usage / clamp_min(video_llm_monthly_budget_capacity, 1) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Video LLM 월간 호출 한도 소진 임박"
          description: "이번 달 NVIDIA Video LLM 실제 API 호출량이 설정된 한도의 90%를 초과한 상태가 5분 이상 지속되고 있습니다. 한도 상향 또는 비용을 확인하세요."

      - alert: VideoLlmFallbackRateHigh
        # 최근 30분간 REAL이 아닌(FALLBACK/MOCK) 응답 비율이 50%를 초과하면 발동합니다.
        # VIDEO_LLM_ENABLED=true인데 실제 모델 호출이 계속 실패해 mock으로 새는 상황을 잡습니다.
        # (VIDEO_LLM_ENABLED=false로 의도적으로 mock만 쓰는 동안에도 발동하므로, 실서비스
        #  활성화 이후에만 의미가 있습니다. 활성화 전이라면 이 알림을 잠시 무시하세요.)
        expr: |
          sum(increase(video_llm_generation_total{mode=~"FALLBACK|MOCK"}[30m]))
          / clamp_min(sum(increase(video_llm_generation_total[30m])), 1) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Video LLM이 실제 모델 대신 mock으로 응답하는 비율이 높습니다"
          description: "최근 30분간 Video LLM 응답의 절반 이상이 FALLBACK/MOCK입니다. NVIDIA_API_KEY 설정, 서킷브레이커 상태, video-llm-engine 로그를 확인하세요. 실제 모델을 켠 상태라면 사용자에게 품질이 낮은 결과가 나가고 있을 수 있습니다."

      - alert: EngineReadinessDegraded
        # /status 또는 운영 점검에서 authenticated readiness가 호출됐을 때 실패 결과가 기록됩니다.
        # 실패 outcome이 10분 이상 계속 늘면 엔진 프로세스 생존 여부와 별개로 실제 분석 준비가
        # 깨진 상태일 수 있습니다.
        expr: |
          sum by (engine) (
            increase(engine_readiness_check_total{outcome=~"not_ready|unauthenticated|unreachable"}[10m])
          ) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "엔진 readiness가 degraded 상태입니다"
          description: "{{ $labels.engine }} 엔진의 authenticated readiness 점검이 실패했습니다. 내부 API 키, 모델 로딩, 외부 API 설정, 엔진 로그를 확인하세요."

      - alert: ResultDataIssueDetected
        # 결과 목록/상세 조회 중 누락 영상, 누락 결과 파일, placeholder 결과가 감지되면 발동합니다.
        # 사용자가 조회하기 전까지 관측되지 않는 지표라서 1건이라도 운영자가 확인해야 합니다.
        expr: |
          sum by (issue) (
            increase(result_data_issue_total[10m])
          ) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "분석 결과 데이터 정합성 문제가 감지됐습니다"
          description: "{{ $labels.issue }} 유형의 결과 데이터 문제가 최근 조회 경로에서 감지됐습니다. jobId는 backend 로그에서 dataIssue 경고를 확인하세요."

  - name: video-processing-alerts
    rules:
      - alert: VideoDurationProbeFailOpenHigh
        # ffprobe로 영상 길이를 확인하지 못해 길이 제한을 fail-open(무조건 통과)시키는 비율이
        # 최근 30분간 30%를 넘으면 발동합니다. ffprobe 바이너리 누락/권한/코덱 문제일 수 있고,
        # 이 상태가 지속되면 VIDEO_MAX_DURATION_MINUTES(기본 30분) 제한이 사실상 무력화됩니다.
        expr: |
          sum(increase(video_duration_probe_result_total{outcome="fail_open"}[30m]))
          / clamp_min(sum(increase(video_duration_probe_result_total[30m])), 1) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ffprobe 영상 길이 확인 실패(fail-open) 비율이 높습니다"
          description: "최근 30분간 영상 길이 확인이 30% 이상 fail-open으로 통과됐습니다. backend 컨테이너에 ffprobe가 정상 설치돼 있는지, 업로드 파일이 손상되지 않았는지 확인하세요. 지속되면 영상 길이 제한이 무력화됩니다."

  - name: backup-alerts
    rules:
      - alert: MysqlBackupFailed
        expr: mysql_backup_last_run_status == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "MySQL 백업이 실패했습니다"
          description: "가장 최근 mysqldump 백업 시도가 실패한 상태가 5분 이상 지속되고 있습니다. backup 컨테이너 로그(storage/logs/backup.log)를 확인하세요."

      - alert: MysqlBackupStale
        # 기본 BACKUP_INTERVAL_HOURS=24를 기준으로, 26시간(24h + 2h 여유) 동안
        # 성공한 백업이 없으면 발동합니다. BACKUP_INTERVAL_HOURS를 바꾼 경우
        # 이 임계값(93600초)도 함께 조정하세요.
        expr: time() - mysql_backup_last_success_timestamp_seconds > 93600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "MySQL 백업이 오랫동안 성공하지 못했습니다"
          description: "가장 최근 성공한 MySQL 백업으로부터 26시간 이상 경과했습니다. backup 컨테이너가 살아있는지, mysqldump가 계속 실패하고 있는지 확인하세요."

      - alert: MysqlBackupRemoteExportFailed
        expr: mysql_backup_remote_export_last_run_status == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "MySQL 백업의 MinIO 원격 반출이 실패했습니다"
          description: "로컬 MySQL 백업은 생성됐지만 가장 최근 MinIO 원격 반출이 실패했습니다. backup 컨테이너의 MinIO 자격 증명, 버킷, 네트워크와 로그를 확인하세요."

      - alert: MysqlBackupRemoteExportStale
        # 원격 반출이 설정된 경우 마지막 성공 이후 26시간이 지나면 로컬 백업 성공 여부와
        # 별개로 발동합니다. 재해복구 사본이 장시간 갱신되지 않는 상황을 탐지합니다.
        expr: mysql_backup_remote_export_configured == 1 and time() - mysql_backup_remote_export_last_success_timestamp_seconds > 93600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "MySQL 원격 백업 사본이 오랫동안 갱신되지 않았습니다"
          description: "MinIO 원격 반출의 마지막 성공으로부터 26시간 이상 경과했습니다. 로컬 백업만 갱신되고 원격 재해복구 사본이 멈춘 것은 아닌지 확인하세요."

  - name: host-alerts
    rules:
      - alert: HostDiskSpaceLow
        expr: node_filesystem_avail_bytes{job="node-exporter", mountpoint=~"/|/rootfs"} / clamp_min(node_filesystem_size_bytes{job="node-exporter", mountpoint=~"/|/rootfs"}, 1) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "호스트 디스크 여유 공간 부족"
          description: "호스트 루트 파일시스템의 여유 공간이 15% 미만인 상태가 10분 이상 지속되고 있습니다. storage 디렉터리와 백업/업로드 파일 사용량을 확인하세요."

      - alert: HostCpuLoadHigh
        expr: node_load1{job="node-exporter"} > (count without (cpu, mode) (node_cpu_seconds_total{job="node-exporter", mode="idle"}) * 1.5)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "호스트 CPU 부하가 높습니다"
          description: "호스트의 1분 평균 CPU 로드가 CPU 코어 수의 1.5배를 초과한 상태가 10분 이상 지속되고 있습니다. 어떤 컨테이너가 CPU를 많이 사용하는지 확인하세요."

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes{job="node-exporter"} / clamp_min(node_memory_MemTotal_bytes{job="node-exporter"}, 1) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "호스트 여유 메모리 부족"
          description: "호스트의 여유 메모리가 전체 메모리의 15% 미만인 상태가 10분 이상 지속되고 있습니다. 메모리 사용량이 높은 컨테이너와 프로세스를 확인하세요."
