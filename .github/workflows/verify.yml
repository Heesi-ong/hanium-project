name: verify

# 이 워크플로우는 실제 디렉토리 구조(backend/frontend/analysis-engine/video-llm-engine) 기준으로
# 작성되었습니다. analysis-engine은 전체 requirements 설치 후 순수 함수 테스트를 실행하고,
# video-llm-engine은 mock 엔드포인트 테스트에 필요한 최소 패키지만 설치해 pytest를 실행합니다.

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x ./gradlew
      - run: ./gradlew test --no-daemon
      - name: Start isolated MinIO for integration tests
        run: >-
          docker run -d --name hanium-minio-integration
          -e MINIO_ROOT_USER=ci-minio-integration
          -e MINIO_ROOT_PASSWORD=ci-minio-integration-password
          -p 127.0.0.1:9000:9000
          minio/minio:RELEASE.2024-12-13T22-19-12Z
          server /data
      - name: Wait for MinIO
        run: |
          for attempt in {1..30}; do
            if docker exec hanium-minio-integration mc ready local; then
              exit 0
            fi
            sleep 1
          done
          docker logs hanium-minio-integration
          exit 1
      - name: Create MinIO integration bucket
        run: >-
          docker run --rm
          --network container:hanium-minio-integration
          -e MC_HOST_local=http://ci-minio-integration:ci-minio-integration-password@127.0.0.1:9000
          minio/mc:RELEASE.2025-08-13T08-35-41Z
          mb --ignore-existing local/hanium-storage
      - name: Run MinIO storage and backfill integration tests
        env:
          MINIO_INTEGRATION_TEST: "true"
          MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_PUBLIC_ENDPOINT: http://127.0.0.1:9000
          MINIO_ACCESS_KEY: ci-minio-integration
          MINIO_SECRET_KEY: ci-minio-integration-password
          MINIO_BUCKET_NAME: hanium-storage
        run: >-
          ./gradlew test
          --tests com.hanium.presentation.infrastructure.storage.MinioObjectStorageIntegrationTest
          --tests com.hanium.presentation.application.storage.ObjectStorageBackfillMinioIntegrationTest
          --rerun-tasks
          --no-daemon
      - name: Dump MinIO logs on failure
        if: failure()
        run: docker logs hanium-minio-integration
      - name: Remove isolated MinIO
        if: always()
        run: docker rm -f hanium-minio-integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high
      # 공개(로그인 불필요) 페이지의 라우팅/렌더 회귀와 2026-07-16 P0 명암비 버그
      # 같은 유형을 잡는 E2E다. 백엔드 없이 프론트 dev 서버만으로 실행 가능한
      # public-flow.spec.js만 CI에서 돈다(E2E_FULL_STACK 미설정이면 로그인 필요
      # 스펙은 자체적으로 skip된다) — 전체 스택 E2E는 아직 CI에 없다.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- e2e/public-flow.spec.js

  python-engines:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [analysis-engine, video-llm-engine]
        include:
          - engine: analysis-engine
            requirements-file: requirements.txt
          - engine: video-llm-engine
            # video-llm-engine은 현재 mock 중심이라, 테스트에 torch/transformers 등
            # 무거운 real-model 의존성(requirements-real-model.txt)이 필요 없습니다.
            # requirements-test.txt(=requirements-base.txt + pytest + Starlette TestClient용 HTTPX2)만 설치/감사합니다.
            requirements-file: requirements-test.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.engine }}/${{ matrix.requirements-file }}
      - run: python -m compileall -q app
        working-directory: ${{ matrix.engine }}
      - run: pip install -r ${{ matrix.requirements-file }}
        working-directory: ${{ matrix.engine }}
      - run: pip install pip-audit
        working-directory: ${{ matrix.engine }}
      - run: pip-audit --no-deps --disable-pip -r ${{ matrix.requirements-file }}
        working-directory: ${{ matrix.engine }}
      - run: pytest
        working-directory: ${{ matrix.engine }}
      # requirements-real-model.txt(VIDEO_LLM_BACKEND=local-model 전용, torch/transformers 등)는
      # 무거워서 설치/pytest 대상에는 넣지 않지만, --disable-pip 감사는 패키지를 설치하지 않고
      # 고정된 버전만 취약점 DB와 대조하므로 여기서는 가볍게 실행할 수 있습니다. 이 파일이
      # CI 감사 사각지대로 남지 않도록(핀 고정 버전에 취약점이 생겨도 아무도 모르는 상태 방지)
      # video-llm-engine 레그에서만 추가로 감사합니다.
      - name: Audit requirements-real-model.txt (설치 없이 핀 고정 버전만 감사)
        if: matrix.engine == 'video-llm-engine'
        run: pip-audit --no-deps --disable-pip -r requirements-real-model.txt
        working-directory: video-llm-engine

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - backend
          - frontend
          - analysis-engine
          - video-llm-engine
          - backup
          - nginx
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          if [[ "${{ matrix.image }}" == "backup" ]]; then
            docker build -f infra/backup/Dockerfile -t hanium-backup:ci .
          elif [[ "${{ matrix.image }}" == "nginx" ]]; then
            docker build -t hanium-nginx:ci infra/nginx
          else
            docker build -t "hanium-${{ matrix.image }}:ci" "${{ matrix.image }}"
          fi
      - name: Verify service Docker contexts exclude env files
        if: matrix.image == 'backend' || matrix.image == 'frontend' || matrix.image == 'analysis-engine' || matrix.image == 'video-llm-engine'
        run: grep -qx '.env\*' "${{ matrix.image }}/.dockerignore"
      - name: Verify root Docker context allowlist
        if: matrix.image == 'backup'
        run: |
          grep -qx '\*\*' .dockerignore
          grep -qx '!infra/backup/Dockerfile' .dockerignore
          grep -qx '!infra/backup/backup-loop.sh' .dockerignore
          grep -qx '!scripts/backup-mysql.sh' .dockerignore
          ! grep -qx '!.env' .dockerignore
          ! grep -qx '!.runtime/' .dockerignore
          ! grep -qx '!frontend/node_modules/' .dockerignore
      - name: Verify backup image tools
        if: matrix.image == 'backup'
        run: >-
          docker run --rm --entrypoint /bin/bash hanium-backup:ci
          -c 'command -v mysqldump gzip openssl mc && mc --version'
      - name: Verify frontend runtime healthcheck tools
        if: matrix.image == 'frontend'
        run: >-
          docker run --rm
          --entrypoint /bin/sh
          -e BACKEND_API_UPSTREAM=backend:8080
          hanium-frontend:ci
          -c 'command -v wget && /docker-entrypoint.sh nginx -t'
      - name: Verify nginx TLS bootstrap tools
        if: matrix.image == 'nginx'
        run: >-
          docker run --rm
          --entrypoint /bin/sh
          -e DOMAIN=example.com
          -e MINIO_PUBLIC_ENDPOINT=https://storage.example.com
          --add-host backend:127.0.0.1
          --add-host frontend:127.0.0.1
          -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro"
          hanium-nginx:ci
          -c 'command -v openssl && cert_dir="/etc/letsencrypt/live/${DOMAIN}" && mkdir -p "${cert_dir}" && openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout "${cert_dir}/privkey.pem" -out "${cert_dir}/fullchain.pem" -subj "/CN=${DOMAIN}" >/tmp/openssl.out 2>&1 && touch "${cert_dir}/.bootstrap-self-signed" && test -f "${cert_dir}/fullchain.pem" && test -f "${cert_dir}/privkey.pem" && test -f "${cert_dir}/.bootstrap-self-signed" && /docker-entrypoint.sh nginx -t && grep -q "server_name example.com" /etc/nginx/conf.d/default.conf && grep -q "proxy_pass http://backend:8080" /etc/nginx/conf.d/default.conf && grep -q "proxy_set_header X-Forwarded-For \\$remote_addr" /etc/nginx/conf.d/default.conf'
      - name: Test backup local and remote status handling
        if: matrix.image == 'backup'
        run: bash scripts/tests/test-backup-mysql.sh
      - name: Test analysis engine inside runtime image
        if: matrix.image == 'analysis-engine'
        run: >-
          docker run --rm
          --entrypoint python
          -v "$PWD/analysis-engine/tests:/app/tests:ro"
          hanium-analysis-engine:ci
          -m pytest -q
      - name: Smoke-test Video LLM runtime image
        if: matrix.image == 'video-llm-engine'
        run: >-
          docker run --rm
          --entrypoint python
          hanium-video-llm-engine:ci
          -c 'import logging, tempfile; from logging.handlers import TimedRotatingFileHandler; from app.main import app; from app.api.video_llm_analysis import resolve_video_max_size_bytes; from app.core.logging_config import configure_logging; assert resolve_video_max_size_bytes() == 500 * 1024 * 1024; logger = logging.getLogger("video-llm-engine"); logger.handlers.clear(); import os; os.environ["LOG_DIR"] = tempfile.mkdtemp(); configure_logging(); handlers = [handler for handler in logger.handlers if isinstance(handler, TimedRotatingFileHandler)]; assert len(handlers) == 1; assert handlers[0].when == "MIDNIGHT"; assert handlers[0].backupCount == 30; print(app.title)'
      - name: Verify Python runtime image dependencies
        if: matrix.image == 'analysis-engine' || matrix.image == 'video-llm-engine'
        run: >-
          docker run --rm
          --entrypoint python
          hanium-${{ matrix.image }}:ci
          -m pip check
      - name: Trivy image vulnerability scan (report only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: hanium-${{ matrix.image }}:ci
          format: table
          exit-code: "0"
          vuln-type: os
          severity: CRITICAL,HIGH

  backend-boot-smoke:
    # docker compose config(compose-validate)는 YAML 문법만 검사하고 컨테이너를 띄우지 않아서,
    # 엔티티 매핑과 Flyway 마이그레이션이 어긋나 Hibernate schema-validation에서 기동 자체가
    # 실패하는 유형의 버그(2026-07-16에 ai_coach_messages.content에서 실제로 발생)를 잡지 못한다.
    # 이 잡은 실제 MySQL/Redis/MinIO를 띄우고 backend를 dev 프로필(ddl-auto: validate)로
    # 부팅해 컴포즈 헬스체크를 통과하는지 확인한다.
    runs-on: ubuntu-latest
    env:
      INTERNAL_ENGINE_API_KEY: ci-smoke-test-internal-key
      SECURITY_JWT_SECRET: ci-smoke-test-jwt-secret-not-a-placeholder-value
      MINIO_ROOT_USER: ci-smoke-minio-admin
      MINIO_ROOT_PASSWORD: ci-smoke-minio-password12345
      DB_PASSWORD: ci-smoke-db-password
      DB_ROOT_PASSWORD: ci-smoke-db-root-password
      REDIS_PASSWORD: ci-smoke-redis-password
    steps:
      - uses: actions/checkout@v4
      - name: Start database/cache/object-storage dependencies
        run: docker compose up -d --wait mysql redis minio
      - name: Create MinIO buckets
        run: docker compose up minio-init
      - name: Build backend image
        run: docker compose build backend
      - name: Boot backend (dev profile) and wait for health check
        run: docker compose up -d --wait --no-deps backend
      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs backend
      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend-e2e-full-stack:
    # public-flow.spec.js(frontend job)는 백엔드 없이 도는 공개 페이지만 다룬다.
    # 로그인이 필요한 실제 흐름(auth-api.spec.js, protected-pages.spec.js)은 실제
    # backend+DB 앞에서만 의미가 있어 여기서 별도로 돈다. analysis-engine/
    # video-llm-engine/analysis-worker는 페이지 렌더링·인증 흐름 검증에는 필요
    # 없고(모델 프리로드로 기동이 매우 느려짐) backend-boot-smoke와 같은 이유로
    # --no-deps로 제외한다. backend의 엔진 헬스체크(/api/health/engines)는
    # 엔진이 없으면 "unreachable"로 우아하게 응답하도록 이미 구현되어 있다.
    runs-on: ubuntu-latest
    env:
      INTERNAL_ENGINE_API_KEY: ci-e2e-internal-key
      SECURITY_JWT_SECRET: ci-e2e-jwt-secret-not-a-placeholder-value
      MINIO_ROOT_USER: ci-e2e-minio-admin
      MINIO_ROOT_PASSWORD: ci-e2e-minio-password12345
      DB_PASSWORD: ci-e2e-db-password
      DB_ROOT_PASSWORD: ci-e2e-db-root-password
      REDIS_PASSWORD: ci-e2e-redis-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start database/cache/object-storage dependencies
        run: docker compose up -d --wait mysql redis minio
      - name: Create MinIO buckets
        run: docker compose up minio-init
      - name: Build backend and frontend images
        run: docker compose build backend frontend
      - name: Boot backend and frontend and wait for health checks
        run: docker compose up -d --wait --no-deps backend frontend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run full-stack E2E specs
        working-directory: frontend
        env:
          E2E_FULL_STACK: "true"
          BASE_URL: http://localhost:5173
          API_BASE_URL: http://localhost:8080
        run: npm run test:e2e -- e2e/auth-api.spec.js e2e/protected-pages.spec.js
      - name: Dump backend/frontend logs on failure
        if: failure()
        run: |
          docker compose logs backend
          docker compose logs frontend
      - name: Tear down
        if: always()
        run: docker compose down -v

  compose-validate:
    runs-on: ubuntu-latest
    env:
      DOMAIN: example.com
      CERTBOT_EMAIL: ops@example.com
      MINIO_PUBLIC_ENDPOINT: https://storage.example.com
      CORS_ALLOWED_ORIGINS: https://example.com
      PASSWORD_RESET_URL_BASE: https://example.com/reset-password
      SECURITY_JWT_SECRET: ci-compose-validate-jwt-secret-not-a-placeholder
      DB_PASSWORD: ci-compose-db-password
      DB_ROOT_PASSWORD: ci-compose-db-root-password
      REDIS_PASSWORD: ci-compose-redis-password
      INTERNAL_ENGINE_API_KEY: ci-compose-internal-key
      MINIO_ROOT_USER: ci-compose-minio-admin
      MINIO_ROOT_PASSWORD: ci-compose-minio-password12345
      BACKUP_ENCRYPTION_PASSPHRASE: ci-compose-backup-encryption-passphrase
      ALERT_SMTP_SMARTHOST: smtp.example.com:587
      ALERT_SMTP_FROM: alerts@example.com
      ALERT_SMTP_USERNAME: alerts@example.com
      ALERT_EMAIL_TO: oncall@example.com
    steps:
      - uses: actions/checkout@v4
      - name: Validate base compose
        run: docker compose -f docker-compose.yml config
      - name: Verify service readiness startup contract
        run: |
          docker compose -f docker-compose.yml config --format json > /tmp/base-compose.json
          python3 - <<'PY'
          import json

          with open('/tmp/base-compose.json', encoding='utf-8') as compose_file:
              services = json.load(compose_file)['services']

          readiness_dependencies = (
              'mysql',
              'redis',
              'analysis-engine',
              'minio',
              'video-llm-engine',
          )

          for dependency in readiness_dependencies:
              healthcheck = services[dependency].get('healthcheck', {})
              assert healthcheck.get('test'), f'{dependency} healthcheck is missing'

          frontend_healthcheck = services['frontend'].get('healthcheck', {})
          assert frontend_healthcheck.get('test'), 'frontend healthcheck is missing'

          for consumer in ('backend', 'analysis-worker'):
              dependencies = services[consumer].get('depends_on', {})
              for dependency in readiness_dependencies:
                  condition = dependencies.get(dependency, {}).get('condition')
                  assert condition == 'service_healthy', (
                      f'{consumer} must wait for {dependency} service_healthy, got {condition!r}'
                  )

          frontend_backend_condition = services['frontend']['depends_on'].get('backend', {}).get('condition')
          assert frontend_backend_condition == 'service_healthy', (
              f'frontend must wait for backend service_healthy, got {frontend_backend_condition!r}'
          )

          for dependency in ('mysql', 'minio'):
              condition = services['backup']['depends_on'].get(dependency, {}).get('condition')
              assert condition == 'service_healthy', (
                  f'backup must wait for {dependency} service_healthy, got {condition!r}'
              )

          for consumer in ('backup', 'backend', 'analysis-worker'):
              condition = services[consumer]['depends_on'].get('minio-init', {}).get('condition')
              assert condition == 'service_completed_successfully', (
                  f'{consumer} must wait for minio-init completion, got {condition!r}'
              )

          print('Service readiness startup contract OK')
          PY
      - name: Validate prod overlay
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config
      - name: Verify prod edge waits for healthy app services
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --format json > /tmp/prod-compose.json
          python3 - <<'PY'
          import json

          with open('/tmp/prod-compose.json', encoding='utf-8') as compose_file:
              services = json.load(compose_file)['services']

          nginx_service = services['nginx']
          nginx_dependencies = services['nginx'].get('depends_on', {})
          for dependency in ('backend', 'frontend'):
              condition = nginx_dependencies.get(dependency, {}).get('condition')
              assert condition == 'service_healthy', (
                  f'nginx must wait for {dependency} service_healthy, got {condition!r}'
              )

          nginx_command = '\n'.join(nginx_service.get('command', []))
          assert '/docker-entrypoint.sh nginx' in nginx_command, (
              'nginx bootstrap command must re-enter the official entrypoint so envsubst renders templates'
          )

          letsencrypt_volume = next(
              (
                  volume for volume in nginx_service.get('volumes', [])
                  if volume.get('target') == '/etc/letsencrypt'
              ),
              None,
          )
          assert letsencrypt_volume is not None, 'nginx must mount the letsencrypt volume'
          assert not letsencrypt_volume.get('read_only', False), (
              'nginx letsencrypt volume must be writable for first-boot self-signed bootstrap'
          )

          frontend_build_args = services['frontend'].get('build', {}).get('args', {})
          vite_api_base_url = frontend_build_args.get('VITE_API_BASE_URL')
          assert vite_api_base_url == '', (
              'prod frontend must use same-origin /api routing behind nginx, '
              f'got VITE_API_BASE_URL={vite_api_base_url!r}'
          )

          expected_backend_flags = {
              'SECURITY_JWT_COOKIE_SECURE': 'true',
              'SECURITY_API_DOCS_PUBLIC_ENABLED': 'false',
              'SECURITY_CLIENT_IP_TRUST_FORWARDED_HEADERS': 'true',
              'VIDEO_DURATION_PROBE_REQUIRED': 'true',
              'STORAGE_OBJECT_WRITE_REQUIRED': 'true',
              'STORAGE_OBJECT_READ_PREFERRED': 'true',
          }
          for service_name in ('backend', 'analysis-worker'):
              environment = services[service_name].get('environment', {})
              for key, expected_value in expected_backend_flags.items():
                  actual_value = environment.get(key)
                  assert actual_value == expected_value, (
                      f'{service_name} prod env {key} must be {expected_value!r}, got {actual_value!r}'
                  )

          print('Production edge startup contract OK')
          PY
      - name: Ensure prod rejects an unencrypted backup configuration
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ""
        run: |
          if docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/tmp/prod-compose.yml 2>/tmp/prod-compose.err; then
            echo "Production compose unexpectedly accepted an empty backup encryption passphrase"
            exit 1
          fi
          grep -q "BACKUP_ENCRYPTION_PASSPHRASE must be set" /tmp/prod-compose.err
      - name: Validate monitoring overlay
        run: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml config
      - name: Validate prod + monitoring together
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.monitoring.yml config
      - name: Validate monitoring config file syntax
        run: |
          python3 -m pip install pyyaml
          python3 -c "
          import yaml, json, glob
          yaml_files = [
              'infra/prometheus/prometheus.yml',
              'infra/prometheus/alerts.yml',
              'infra/alertmanager/alertmanager.yml',
              'infra/grafana/provisioning/datasources/prometheus.yml',
              'infra/grafana/provisioning/dashboards/dashboards.yml',
          ]
          for f in yaml_files:
              yaml.safe_load(open(f))
              print(f, 'OK')
          for f in glob.glob('infra/grafana/provisioning/dashboards/json/*.json'):
              json.load(open(f))
              print(f, 'OK')
          "
      - name: Validate Prometheus config and rules with promtool
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.13.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            -w /etc/prometheus \
            prom/prometheus:v3.13.0 \
            test rules alerts.test.yml
      - name: Validate k6 load-test script
        run: >-
          docker run --rm
          -v "$PWD:/workspace:ro"
          -w /workspace/scripts/load-test
          grafana/k6:2.1.0
          inspect upload-analyze.js
