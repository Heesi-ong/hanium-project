rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: video llm degraded fallback rate becomes warning
    interval: 1m
    input_series:
      - series: 'video_llm_generation_total{mode="REAL"}'
        values: 0+1x20
      - series: 'video_llm_generation_total{mode="FALLBACK"}'
        values: 0+2x20
      - series: 'video_llm_generation_total{mode="MOCK"}'
        values: 0+10x20
    alert_rule_test:
      - eval_time: 12m
        alertname: VideoLlmFallbackRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Video LLM이 실제 모델 대신 mock으로 응답하는 비율이 높습니다"
              description: "최근 30분간 실제 Video LLM 시도 응답의 절반 이상이 FALLBACK입니다. NVIDIA 연동 상태, 서킷브레이커와 video-llm-engine 로그를 확인하세요. DEGRADED 정책에서 사용자에게 샘플 대체 결과가 나가고 있습니다."

  - name: jwt revocation database failure becomes critical
    interval: 1m
    input_series:
      - series: 'security_jwt_revocation_total{result="database_read_failure"}'
        values: 0+1x10
    alert_rule_test:
      - eval_time: 3m
        alertname: JwtRevocationDatabaseUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "JWT 폐기 DB 원장을 사용할 수 없습니다"
              description: "토큰 폐기 상태의 DB 읽기/쓰기가 실패해 인증 요청 또는 로그아웃이 503으로 차단됐습니다. MySQL 연결과 backend 로그의 JWT_REVOCATION_UNAVAILABLE 오류를 즉시 확인하세요."

  - name: jwt revocation redis cache failure becomes warning
    interval: 1m
    input_series:
      - series: 'security_jwt_revocation_total{result="redis_read_failure"}'
        values: 0+1x15
    alert_rule_test:
      - eval_time: 7m
        alertname: JwtRevocationRedisCacheFailure
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "JWT 폐기 Redis 캐시가 비정상입니다"
              description: "JWT 폐기 Redis 캐시 오류가 지속돼 DB 최종 원장 fallback으로 처리 중입니다. 인증 보장은 유지되지만 DB 부하가 증가하므로 Redis 연결을 확인하세요."

  - name: storage deletion dead letter backlog becomes warning
    interval: 1m
    input_series:
      - series: storage_deletion_dead_letter
        values: 1x15
    alert_rule_test:
      - eval_time: 12m
        alertname: StorageDeletionDeadLetterBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "스토리지 삭제 작업이 DEAD_LETTER 상태로 쌓이고 있습니다"
              description: "storage_deletion_dead_letter가 10분 이상 0보다 큽니다. 관리자 대시보드에서 DEAD_LETTER 목록을 확인하고, MinIO 상태를 점검한 뒤 재큐잉하세요."

  - name: password reset email dead letter backlog becomes warning
    interval: 1m
    input_series:
      - series: password_reset_email_dead_letter
        values: 1x15
    alert_rule_test:
      - eval_time: 12m
        alertname: PasswordResetEmailDeadLetterBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "비밀번호 재설정 이메일이 DEAD_LETTER 상태로 쌓이고 있습니다"
              description: "password_reset_email_dead_letter가 10분 이상 0보다 큽니다. 관리자 대시보드에서 DEAD_LETTER 목록을 확인하고, SMTP 상태를 점검한 뒤 재큐잉하세요."

  - name: remote backup export failure becomes critical
    interval: 1m
    input_series:
      - series: mysql_backup_remote_export_last_run_status
        values: 0x10
    alert_rule_test:
      - eval_time: 6m
        alertname: MysqlBackupRemoteExportFailed
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "MySQL 백업의 MinIO 원격 반출이 실패했습니다"
              description: "로컬 MySQL 백업은 생성됐지만 가장 최근 MinIO 원격 반출이 실패했습니다. backup 컨테이너의 MinIO 자격 증명, 버킷, 네트워크와 로그를 확인하세요."

  - name: engine readiness degraded becomes warning
    interval: 1m
    input_series:
      - series: 'engine_readiness_check_total{engine="video_llm",outcome="not_ready"}'
        values: 0+1x20
    alert_rule_test:
      - eval_time: 20m
        alertname: EngineReadinessDegraded
        exp_alerts:
          - exp_labels:
              engine: video_llm
              severity: warning
            exp_annotations:
              summary: "엔진 readiness가 degraded 상태입니다"
              description: "video_llm 엔진의 authenticated readiness 점검이 실패했습니다. 내부 API 키, 모델 로딩, 외부 API 설정, 엔진 로그를 확인하세요."

  - name: result data issue becomes warning
    interval: 1m
    input_series:
      - series: 'result_data_issue_total{source="detail",issue="RESULT_DATA_INCOMPLETE"}'
        values: 0+1x10
    alert_rule_test:
      - eval_time: 10m
        alertname: ResultDataIssueDetected
        exp_alerts:
          - exp_labels:
              issue: RESULT_DATA_INCOMPLETE
              severity: warning
            exp_annotations:
              summary: "분석 결과 데이터 정합성 문제가 감지됐습니다"
              description: "RESULT_DATA_INCOMPLETE 유형의 결과 데이터 문제가 최근 조회 경로에서 감지됐습니다. jobId는 backend 로그에서 dataIssue 경고를 확인하세요."

  - name: blackbox dependency probe failure becomes critical
    interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-http",component="analysis-engine",instance="http://analysis-engine:8001/health"}'
        values: 0x10
    alert_rule_test:
      - eval_time: 4m
        alertname: ServiceDependencyProbeFailed
        exp_alerts:
          - exp_labels:
              job: blackbox-http
              component: analysis-engine
              instance: http://analysis-engine:8001/health
              severity: critical
            exp_annotations:
              summary: "서비스 의존 구성 요소 probe가 실패했습니다"
              description: "analysis-engine(http://analysis-engine:8001/health) 연결 점검이 2분 이상 실패했습니다. 대상 서비스 상태와 네트워크를 확인하세요."

  - name: backend http 5xx ratio becomes critical only with enough traffic
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="backend",status="200"}'
        values: 0+10x20
      - series: 'http_server_requests_seconds_count{job="backend",status="500"}'
        values: 0+1x20
    alert_rule_test:
      - eval_time: 12m
        alertname: BackendHttp5xxRateHigh
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "backend HTTP 5xx 비율이 높습니다"
              description: "최근 요청이 20건 이상인 구간에서 5xx 비율이 5%를 초과했습니다. 서비스 운영 개요에서 URI별 오류율을 확인하세요."

  - name: backend http p95 latency becomes warning
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_bucket{job="backend",uri="/api/results",le="1.0"}'
        values: 0+1x25
      - series: 'http_server_requests_seconds_bucket{job="backend",uri="/api/results",le="3.0"}'
        values: 0+2x25
      - series: 'http_server_requests_seconds_bucket{job="backend",uri="/api/results",le="10.0"}'
        values: 0+10x25
      - series: 'http_server_requests_seconds_bucket{job="backend",uri="/api/results",le="+Inf"}'
        values: 0+10x25
    alert_rule_test:
      - eval_time: 18m
        alertname: BackendHttpLatencyP95High
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "backend HTTP p95 지연이 높습니다"
              description: "backend HTTP 요청 p95가 3초를 10분 이상 초과했습니다. URI별 지연과 DB pool, JVM, 컨테이너 자원을 함께 확인하세요."

  - name: backend jvm heap high becomes warning
    interval: 1m
    input_series:
      - series: 'jvm_memory_used_bytes{job="backend",area="heap",id="old"}'
        values: 90x20
      - series: 'jvm_memory_max_bytes{job="backend",area="heap",id="old"}'
        values: 100x20
    alert_rule_test:
      - eval_time: 12m
        alertname: BackendJvmHeapUsageHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "backend JVM heap 사용률이 높습니다"
              description: "backend JVM heap 사용률이 85%를 10분 이상 초과했습니다. GC 추세와 컨테이너 메모리 제한을 확인하세요."

  - name: backend hikari pool saturation becomes warning
    interval: 1m
    input_series:
      - series: 'hikaricp_connections_active{job="backend",pool="HikariPool-1"}'
        values: 9x20
      - series: 'hikaricp_connections_max{job="backend",pool="HikariPool-1"}'
        values: 10x20
    alert_rule_test:
      - eval_time: 12m
        alertname: BackendDatabasePoolSaturated
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "backend DB connection pool이 포화 상태입니다"
              description: "Hikari active/max 비율이 80%를 10분 이상 초과했습니다. 느린 쿼리, transaction 범위와 DB 상태를 확인하세요."

  - name: analysis queue near global capacity becomes warning
    interval: 1m
    input_series:
      - series: analysis_queue_backlog
        values: 18x20
      - series: 'analysis_queue_limit{scope="global"}'
        values: 20x20
    alert_rule_test:
      - eval_time: 12m
        alertname: AnalysisQueueNearCapacity
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "분석 큐가 수용 한도에 근접했습니다"
              description: "QUEUED 작업이 전역 한도의 80%를 10분 이상 초과했습니다. worker 상태와 처리량을 확인하고 필요하면 안전하게 확장하세요."
