plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.hanium'
version = '0.0.1-SNAPSHOT'
description = 'presentation coaching backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// Spring Boot 3.5.3 기본 Flyway 11.7.2는 MySQL 8.4를 검증 상한(8.3)보다
// 새 버전으로 경고합니다. 같은 11.x 계열에서 MySQL 9.4까지 판정하는 최신 패치로 맞춥니다.
ext['flyway.version'] = '11.20.3'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    // dev/prod 프로필에서 JSON 구조화 로그(LogstashEncoder)를 만들 때 사용합니다.
    // 버전은 Maven Central maven-metadata.xml에서 확인한 최신 안정 release(9.0)입니다.
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.3.0'
    implementation 'io.github.resilience4j:resilience4j-micrometer:2.3.0'
    // 분석 진행률(%) 캐시와 사용자별 비싼 분석 API rate limit 카운터에 사용합니다.
    // Redis INCR/EXPIRE로 여러 backend 인스턴스에서도 동일한 제한을 공유합니다.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    implementation 'io.minio:minio:9.0.3'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // dev/prod(MySQL) 프로필에서 DB 스키마 버전 관리를 위해 사용합니다.
    // local(H2) 프로필은 spring.flyway.enabled=false 로 꺼져 있어 영향 없습니다.
    implementation 'org.flywaydb:flyway-mysql'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Docker Engine 29는 API 1.44 미만 요청을 거부합니다. Testcontainers가 사용하는
    // docker-java 클라이언트에 호환 가능한 기본값을 주되 CI에서는 환경변수로 덮어씁니다.
    systemProperty 'api.version', System.getenv('DOCKER_API_VERSION') ?: '1.44'
    // 테스트가 끝나면 커버리지 리포트를 자동 생성합니다.
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true   // CI 업로드/뱃지용
        html.required = true  // build/reports/jacoco/test/html/index.html
    }
}

// coverage는 그동안 측정만 하고 최소 하락 기준이 없었다(2026-08-03 서비스화 점검 P2-06).
// 현재 instruction coverage가 약 90%라 85%를 바닥선으로 둔다 — 실질적인 회귀만 잡아내고
// 사소한 변동으로 매번 실패하지 않도록 현재 수준보다 약간 낮게 잡았다. CI(backend job)는
// 전체 test 실행 직후 이 task를 별도로 돌린다. test에 finalizedBy로 자동 연결하지 않는
// 이유는 CI가 이후 특정 통합 테스트만 --rerun-tasks로 다시 돌리는 단계가 있어(MinIO
// 통합 테스트), 거기 걸리면 부분 실행 데이터만으로 커버리지가 오탐 실패하기 때문이다.
tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                minimum = 0.85
            }
            limit {
                counter = 'LINE'
                minimum = 0.85
            }
        }
    }
}
