name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Front/package-lock.json
      - run: python -m pip install -r Back/requirements-dev.txt
      - run: python -m ruff check Back
      - run: python -m coverage run --source=Back/app -m unittest discover -s Back/tests -v
      - run: python -m coverage report --fail-under=45
      - run: npm ci
        working-directory: Front
      - run: npm run format:check
        working-directory: Front
      - run: npm run lint
        working-directory: Front
      - run: npm run test
        working-directory: Front
      - run: npm run build
        working-directory: Front
