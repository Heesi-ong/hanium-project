server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router가 클라이언트 사이드에서 라우팅을 처리하므로,
    # 존재하지 않는 경로 요청은 전부 index.html로 돌려줍니다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산은 오래 캐싱해도 안전합니다 (빌드 시 파일명에 해시가 붙습니다).
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
