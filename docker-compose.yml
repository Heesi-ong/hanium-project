# 학생 프로젝트의 로컬/테스트 시연을 위해 mysql, redis, minio,
# analysis-engine, video-llm-engine, backend, analysis-worker, frontend를 한 번에 띄우는 구성입니다.
# 자동 백업은 기본 시연 범위가 아니며 `--profile ops`를 명시했을 때만 실행됩니다.
#
# 사용법:
#   1) 프로젝트 루트에 .env 파일을 만들고 .env.example을 참고해 값을 채웁니다.
#   2) docker compose up --build
#
# INTERNAL_ENGINE_API_KEY 등 값을 채우지 않으면 안 되는 필수 환경변수는 ${VAR:?메시지} 문법으로
# 표시되어 있습니다. .env에 값이 없거나 비어 있으면 컨테이너가 뜨기도 전에 docker compose
# 자체가 어떤 값이 빠졌는지 알려주며 즉시 실패합니다("애매하게 나중에 실패"하는 대신).
#
# mysql/redis/analysis-engine/video-llm-engine 포트는 로컬 테스트 전용으로
# 127.0.0.1에만 바인딩되어 외부 네트워크에서 접근할 수 없습니다.
#
# 아래 리소스 제한값은 로컬 시연 PC에서 특정 서비스가 자원을 독점하지 않게 하는 기본값입니다.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    environment:
      MYSQL_DATABASE: ${DB_NAME:-hanium_dev}
      MYSQL_USER: ${DB_USERNAME:-hanium}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u root --silent --skip-column-names -e 'SELECT 1' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backup:
    profiles: ["ops"]
    image: hanium-backup:local
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hanium_dev}
      DB_USERNAME: ${DB_USERNAME:-hanium}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      BACKUP_DIR: /backups
      BACKUP_LOG_PATH: /logs/backup.log
      BACKUP_METRICS_PATH: /metrics/mysql_backup.prom
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_FAILURE_RETRY_MINUTES: ${BACKUP_FAILURE_RETRY_MINUTES:-15}
      # 백업 암호화(선택). BACKUP_ENCRYPTION_PASSPHRASE가 비어 있으면 기존처럼 평문 백업이며,
      # 값을 채우면 .sql.gz.enc로 암호화됩니다. 원격(MinIO) 반출을 쓰면 설정을 권장합니다.
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-}
      BACKUP_ENCRYPTION_REQUIRED: ${BACKUP_ENCRYPTION_REQUIRED:-false}
      BACKUP_ENCRYPTION_PBKDF2_ITER: ${BACKUP_ENCRYPTION_PBKDF2_ITER:-200000}
      BACKUP_REMOTE_REQUIRED: ${BACKUP_REMOTE_REQUIRED:-false}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?.env에 MINIO_ROOT_USER를 설정하세요 (.env.example 참고).}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?.env에 MINIO_ROOT_PASSWORD를 설정하세요 (.env.example 참고). 8자 이상이어야 합니다.}
      MINIO_BACKUP_BUCKET_NAME: ${MINIO_BACKUP_BUCKET_NAME:-hanium-backups}
    volumes:
      - "${STORAGE_HOST_PATH:-./storage}/backups:/backups"
      - "${STORAGE_HOST_PATH:-./storage}/logs:/logs"
      - "${STORAGE_HOST_PATH:-./storage}/metrics:/metrics"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
    command: ["/bin/sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli --raw ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?.env에 MINIO_ROOT_USER를 설정하세요 (.env.example 참고).}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?.env에 MINIO_ROOT_PASSWORD를 설정하세요 (.env.example 참고). 8자 이상이어야 합니다.}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?.env에 MINIO_ROOT_USER를 설정하세요 (.env.example 참고).}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?.env에 MINIO_ROOT_PASSWORD를 설정하세요 (.env.example 참고). 8자 이상이어야 합니다.}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-hanium-storage}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/$$MINIO_BUCKET_NAME &&
      echo 'MinIO bucket ready: '$$MINIO_BUCKET_NAME
      "

  analysis-engine:
    build:
      context: ./analysis-engine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    environment:
      INTERNAL_ENGINE_API_KEY: ${INTERNAL_ENGINE_API_KEY:?.env에 INTERNAL_ENGINE_API_KEY를 설정하세요 (.env.example 참고). 비어 있으면 엔진이 모든 분석 요청을 401로 거절합니다.}
      ANALYSIS_ENGINE_WHISPER_POOL_SIZE: ${ANALYSIS_ENGINE_WHISPER_POOL_SIZE:-2}
      ANALYSIS_ENGINE_POSE_POOL_SIZE: ${ANALYSIS_ENGINE_POSE_POOL_SIZE:-2}
      ANALYSIS_ENGINE_FACE_POOL_SIZE: ${ANALYSIS_ENGINE_FACE_POOL_SIZE:-2}
      ANALYSIS_ENGINE_MAX_VIDEO_SIZE_MB: ${ANALYSIS_ENGINE_MAX_VIDEO_SIZE_MB:-500}
      ANALYSIS_ENGINE_WHISPER_TRANSCRIBE_TIMEOUT_SECONDS: ${ANALYSIS_ENGINE_WHISPER_TRANSCRIBE_TIMEOUT_SECONDS:-600}
      ANALYSIS_ENGINE_ALLOWED_DOWNLOAD_HOSTS: ${ANALYSIS_ENGINE_ALLOWED_DOWNLOAD_HOSTS:-minio:9000}
      ANALYSIS_ENGINE_ALLOWED_VIDEO_BASE_DIR: ${ANALYSIS_ENGINE_ALLOWED_VIDEO_BASE_DIR:-/storage}
      # faster-whisper가 사용하는 Hugging Face 모델 캐시를 컨테이너 홈이 아니라
      # 영속 storage에 둡니다. 컨테이너 재생성/배포 때마다 같은 모델을 다시 내려받아
      # 기동이 외부 네트워크와 다운로드 시간에 종속되는 문제를 줄입니다.
      HF_HOME: /storage/models/huggingface
      LOG_DIR: /storage/logs
    ports:
      - "127.0.0.1:${ANALYSIS_ENGINE_PORT:-8001}:8001"
    volumes:
      - "${STORAGE_HOST_PATH:-./storage}:/storage"
    # 사용자가 업로드한 영상을 ffmpeg/OpenCV/MediaPipe로 직접 처리하는 서비스라, 파서
    # 취약점이 나오더라도 컨테이너가 추가 권한을 얻지 못하도록 Linux capability를 전부
    # 제거합니다. non-privileged 포트(8001)만 쓰고 파일 소유권 변경 등도 필요 없어 추가로
    # 되돌려줄 capability가 없습니다.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      # 첫 실행의 Whisper/MediaPipe 모델 다운로드와 풀 프리로드 시간을 허용합니다.
      start_period: 10m

  video-llm-engine:
    build:
      context: ./video-llm-engine
      args:
        # mock(기본) | external-api | local-model. local-model로 바꾸면 torch/transformers
        # 등 무거운 로컬 모델 스택을 설치합니다(video-llm-engine/Dockerfile 참고).
        # external-api는 가벼운 기본 의존성으로 NVIDIA hosted API를 호출하며, 실제 호출
        # 활성화는 이미지 프로필이 아니라 런타임 VIDEO_LLM_ENABLED가 결정합니다.
        VIDEO_LLM_BACKEND: ${VIDEO_LLM_BACKEND:-mock}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          # local-model 빌드 시 실제 모델 로딩 여유를 둔 값입니다. mock/external-api
          # 빌드(기본값)는 이보다 훨씬 적은 메모리로도 충분합니다.
          memory: 6g
    environment:
      INTERNAL_ENGINE_API_KEY: ${INTERNAL_ENGINE_API_KEY:?.env에 INTERNAL_ENGINE_API_KEY를 설정하세요 (.env.example 참고). 비어 있으면 엔진이 모든 분석 요청을 401로 거절합니다.}
      VIDEO_LLM_POLICY: ${VIDEO_LLM_POLICY:-}
      VIDEO_LLM_ENABLED: ${VIDEO_LLM_ENABLED:-false}
      VIDEO_LLM_BACKEND: ${VIDEO_LLM_BACKEND:-mock}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_VIDEO_LLM_MODEL: ${NVIDIA_VIDEO_LLM_MODEL:-nvidia/nemotron-3-nano-omni-30b-a3b-reasoning}
      NVIDIA_API_BASE_URL: ${NVIDIA_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_ASSET_API_BASE_URL: ${NVIDIA_ASSET_API_BASE_URL:-https://api.nvcf.nvidia.com/v2/nvcf}
      NVIDIA_VIDEO_LLM_TIMEOUT_SECONDS: ${NVIDIA_VIDEO_LLM_TIMEOUT_SECONDS:-120}
      VIDEO_LLM_TOTAL_TIMEOUT_SECONDS: ${VIDEO_LLM_TOTAL_TIMEOUT_SECONDS:-540}
      VIDEO_LLM_MAX_VIDEO_SIZE_MB: ${VIDEO_LLM_MAX_VIDEO_SIZE_MB:-500}
      VIDEO_LLM_ALLOWED_VIDEO_BASE_DIR: ${VIDEO_LLM_ALLOWED_VIDEO_BASE_DIR:-/storage}
      VIDEO_LLM_ALLOWED_DOWNLOAD_HOSTS: ${VIDEO_LLM_ALLOWED_DOWNLOAD_HOSTS:-minio:9000}
      VIDEO_LLM_REAL_MODEL_MAX_CONCURRENCY: ${VIDEO_LLM_REAL_MODEL_MAX_CONCURRENCY:-3}
      VIDEO_LLM_REAL_MODEL_SEMAPHORE_TIMEOUT_SECONDS: ${VIDEO_LLM_REAL_MODEL_SEMAPHORE_TIMEOUT_SECONDS:-30}
      VIDEO_LLM_CHUNK_DURATION_SECONDS: ${VIDEO_LLM_CHUNK_DURATION_SECONDS:-100}
      VIDEO_LLM_SEGMENT_SPLIT_TIMEOUT_SECONDS: ${VIDEO_LLM_SEGMENT_SPLIT_TIMEOUT_SECONDS:-30}
      VIDEO_LLM_MAX_DURATION_SECONDS: ${VIDEO_LLM_MAX_DURATION_SECONDS:-7200}
      LOG_DIR: /storage/logs
    ports:
      - "127.0.0.1:${VIDEO_LLM_ENGINE_PORT:-8002}:8002"
    volumes:
      - "${STORAGE_HOST_PATH:-./storage}:/storage"
    # analysis-engine과 같은 이유(신뢰할 수 없는 영상 처리)로 capability를 전부 제거합니다.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    # analysis-worker와 완전히 같은 Dockerfile/컨텍스트를 쓰지만, image를 명시하지 않으면
    # compose가 서비스별로 별도 이미지 태그(haniumproject-backend / haniumproject-analysis-worker)를
    # 만들어버립니다. 배포 스크립트가 한쪽만 재빌드하면 다른 쪽이 조용히 구버전으로 남아
    # 스케줄러 전체가 멈추는 사고가 실제로 있었습니다(2026-07-23). 같은 image 태그를 공유시켜
    # 하나만 빌드해도 둘 다 최신 상태가 되게 합니다.
    image: presentation-coaching-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    # Spring graceful shutdown(기본 30초)과 JVM/컨테이너 종료 오버헤드를 고려한 유예 시간입니다.
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      analysis-engine:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      video-llm-engine:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-presentation-coaching-local-jwt-secret-change-me-2026}
      SECURITY_JWT_EXPIRATION_MINUTES: ${SECURITY_JWT_EXPIRATION_MINUTES:-30}
      JWT_REVOCATION_CLEANUP_CRON: ${JWT_REVOCATION_CLEANUP_CRON:-0 15 * * * *}
      SCHEDULER_LOCK_JWT_REVOCATION_CLEANUP_TTL_MINUTES: ${SCHEDULER_LOCK_JWT_REVOCATION_CLEANUP_TTL_MINUTES:-10}
      SECURITY_JWT_COOKIE_SECURE: ${SECURITY_JWT_COOKIE_SECURE:-false}
      SECURITY_API_DOCS_PUBLIC_ENABLED: ${SECURITY_API_DOCS_PUBLIC_ENABLED:-true}
      SECURITY_CLIENT_IP_TRUST_FORWARDED_HEADERS: ${SECURITY_CLIENT_IP_TRUST_FORWARDED_HEADERS:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hanium_dev}
      DB_USERNAME: ${DB_USERNAME:-hanium}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-2000}
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-2000}
      VIDEO_MAX_FILE_SIZE: ${VIDEO_MAX_FILE_SIZE:-500MB}
      VIDEO_MAX_REQUEST_SIZE: ${VIDEO_MAX_REQUEST_SIZE:-501MB}
      VIDEO_LLM_CHUNK_DURATION_SECONDS: ${VIDEO_LLM_CHUNK_DURATION_SECONDS:-100}
      ANALYSIS_ENGINE_BASE_URL: http://analysis-engine:8001
      VIDEO_LLM_ENGINE_BASE_URL: http://video-llm-engine:8002
      INTERNAL_ENGINE_API_KEY: ${INTERNAL_ENGINE_API_KEY:?.env에 INTERNAL_ENGINE_API_KEY를 설정하세요 (.env.example 참고). 비어 있으면 엔진이 모든 분석 요청을 401로 거절합니다.}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-15000}
      # AI 코치가 OpenAI 대신 build.nvidia.com의 무료/오픈 모델을 쓰게 하는 스위치입니다
      # (coach.llm.provider). application.yaml의 coach.llm.nvidia-api-key/-base-url이 아래
      # NVIDIA_API_KEY/NVIDIA_API_BASE_URL을 그대로 읽으므로(video-llm-engine과 동일 키
      # 재사용), 별도 COACH_LLM_NVIDIA_API_KEY 같은 env는 필요 없습니다.
      COACH_LLM_PROVIDER: ${COACH_LLM_PROVIDER:-openai}
      COACH_LLM_NVIDIA_MODEL: ${COACH_LLM_NVIDIA_MODEL:-google/diffusiongemma-26b-a4b-it}
      # 분석 피드백 생성도 같은 방식으로 대체합니다.
      FEEDBACK_LLM_PROVIDER: ${FEEDBACK_LLM_PROVIDER:-openai}
      FEEDBACK_LLM_NVIDIA_MODEL: ${FEEDBACK_LLM_NVIDIA_MODEL:-google/diffusiongemma-26b-a4b-it}
      FEEDBACK_LLM_NVIDIA_TIMEOUT_MS: ${FEEDBACK_LLM_NVIDIA_TIMEOUT_MS:-90000}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_API_BASE_URL: ${NVIDIA_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-true}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
      SMTP_READ_TIMEOUT_MS: ${SMTP_READ_TIMEOUT_MS:-10000}
      SMTP_WRITE_TIMEOUT_MS: ${SMTP_WRITE_TIMEOUT_MS:-10000}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
      PASSWORD_RESET_ENABLED: ${PASSWORD_RESET_ENABLED:-true}
      PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:-http://localhost:5173/reset-password}
      PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:-30}
      PASSWORD_RESET_OUTBOX_ENCRYPTION_KEY: ${PASSWORD_RESET_OUTBOX_ENCRYPTION_KEY:-local-password-reset-outbox-key-change-me}
      PASSWORD_RESET_OUTBOX_POLL_INTERVAL_MS: ${PASSWORD_RESET_OUTBOX_POLL_INTERVAL_MS:-5000}
      PASSWORD_RESET_OUTBOX_MAX_ATTEMPTS: ${PASSWORD_RESET_OUTBOX_MAX_ATTEMPTS:-5}
      PASSWORD_RESET_OUTBOX_BASE_BACKOFF_SECONDS: ${PASSWORD_RESET_OUTBOX_BASE_BACKOFF_SECONDS:-30}
      PASSWORD_RESET_OUTBOX_MAX_BACKOFF_SECONDS: ${PASSWORD_RESET_OUTBOX_MAX_BACKOFF_SECONDS:-300}
      PASSWORD_RESET_OUTBOX_CLAIM_LEASE_SECONDS: ${PASSWORD_RESET_OUTBOX_CLAIM_LEASE_SECONDS:-60}
      SCHEDULER_LOCK_PASSWORD_RESET_EMAIL_WORKER_TTL_SECONDS: ${SCHEDULER_LOCK_PASSWORD_RESET_EMAIL_WORKER_TTL_SECONDS:-4}
      LOGIN_RATE_LIMIT_CAPACITY: ${LOGIN_RATE_LIMIT_CAPACITY:-5}
      LOGIN_RATE_LIMIT_REFILL_MINUTES: ${LOGIN_RATE_LIMIT_REFILL_MINUTES:-10}
      LOGIN_IP_RATE_LIMIT_CAPACITY: ${LOGIN_IP_RATE_LIMIT_CAPACITY:-20}
      LOGIN_IP_RATE_LIMIT_REFILL_MINUTES: ${LOGIN_IP_RATE_LIMIT_REFILL_MINUTES:-10}
      SIGNUP_RATE_LIMIT_CAPACITY: ${SIGNUP_RATE_LIMIT_CAPACITY:-5}
      SIGNUP_RATE_LIMIT_REFILL_MINUTES: ${SIGNUP_RATE_LIMIT_REFILL_MINUTES:-10}
      PASSWORD_RESET_RATE_LIMIT_CAPACITY: ${PASSWORD_RESET_RATE_LIMIT_CAPACITY:-5}
      PASSWORD_RESET_RATE_LIMIT_REFILL_MINUTES: ${PASSWORD_RESET_RATE_LIMIT_REFILL_MINUTES:-10}
      PASSWORD_RESET_CONFIRM_RATE_LIMIT_CAPACITY: ${PASSWORD_RESET_CONFIRM_RATE_LIMIT_CAPACITY:-10}
      PASSWORD_RESET_CONFIRM_RATE_LIMIT_REFILL_MINUTES: ${PASSWORD_RESET_CONFIRM_RATE_LIMIT_REFILL_MINUTES:-10}
      PASSWORD_CHANGE_RATE_LIMIT_CAPACITY: ${PASSWORD_CHANGE_RATE_LIMIT_CAPACITY:-10}
      PASSWORD_CHANGE_RATE_LIMIT_REFILL_MINUTES: ${PASSWORD_CHANGE_RATE_LIMIT_REFILL_MINUTES:-10}
