# 이 파일은 docker-compose.prod.yml에서 /etc/nginx/templates/default.conf.template로
# 마운트되어 nginx 공식 이미지의 entrypoint가 envsubst 치환 후 /etc/nginx/conf.d/에
# 생성합니다. conf.d는 베이스 이미지의 http{} 블록 안에 include되므로, 아래처럼
# server{} 밖(파일 최상단)에 쓴 지시어는 http{} 컨텍스트 지시어로 적용됩니다.

# nginx 버전을 응답 헤더/기본 에러 페이지에서 숨겨 정찰 단서를 줄입니다.
server_tokens off;

# 요청 속도·동시 연결 수를 IP 기준으로 제한합니다. backend의 bucket4j 요청 제한과
# 별개로, Spring까지 도달하기 전 엣지 단에서 걸러주는 계층입니다. 값은 일반적인
# 폴링 패턴(분석 상태 1~1.5초 간격)을 넉넉히 허용하면서, 대량 요청으로 워커
# 연결을 소진시키는 시나리오만 완화하도록 보수적으로 잡았습니다.
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 500m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; img-src 'self' data:; media-src 'self' ${MINIO_PUBLIC_ENDPOINT}; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location /api/ {
        limit_req zone=general_limit burst=60 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 모니터링 도구가 짧은 주기로 폴링하는 헬스체크 경로라 속도 제한 대상에서 제외합니다.
    location /actuator/health {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        limit_req zone=general_limit burst=60 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
