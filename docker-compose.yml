      ANALYSIS_ENGINE_CIRCUIT_BREAKER_AUTO_HALF_OPEN_ENABLED: ${ANALYSIS_ENGINE_CIRCUIT_BREAKER_AUTO_HALF_OPEN_ENABLED:-true}
      VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:-10}
      VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_MINIMUM_NUMBER_OF_CALLS: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_MINIMUM_NUMBER_OF_CALLS:-5}
      VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:-50}
      VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_SLOW_CALL_DURATION_THRESHOLD: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_SLOW_CALL_DURATION_THRESHOLD:-9m}
      VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_SLOW_CALL_RATE_THRESHOLD: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_SLOW_CALL_RATE_THRESHOLD:-100}
      VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_WAIT_DURATION_IN_OPEN_STATE: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_WAIT_DURATION_IN_OPEN_STATE:-30s}
      VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_HALF_OPEN_PERMITTED_CALLS: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_HALF_OPEN_PERMITTED_CALLS:-3}
      VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_AUTO_HALF_OPEN_ENABLED: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_AUTO_HALF_OPEN_ENABLED:-true}
    ports:
      - "8080:8080"
    volumes:
      - "${STORAGE_HOST_PATH:-./storage}:/storage"
    # non-root(appuser)로 실행되고 non-privileged 포트만 쓰므로 capability가 필요 없습니다.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # 분석 실행 전용 워커. backend와 같은 이미지를 역할만 다르게 띄웁니다.
  # HTTP 요청은 받지 않고(포트 미공개) QUEUED 작업을 폴링해 실행합니다.
  # 부하가 커지면 `docker compose up -d --scale analysis-worker=N`으로 늘릴 수 있습니다.
  # (중복 실행은 DB 낙관적 락 기반 claim으로 방지되어 안전합니다.)
  analysis-worker:
    # backend와 image를 공유합니다(위 backend 서비스의 주석 참고) — 둘 중 하나만 빌드해도
    # 서로 어긋나지 않도록 하기 위함입니다.
    image: presentation-coaching-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      analysis-engine:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      video-llm-engine:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-presentation-coaching-local-jwt-secret-change-me-2026}
      SECURITY_JWT_EXPIRATION_MINUTES: ${SECURITY_JWT_EXPIRATION_MINUTES:-30}
      JWT_REVOCATION_CLEANUP_CRON: ${JWT_REVOCATION_CLEANUP_CRON:-0 15 * * * *}
      SCHEDULER_LOCK_JWT_REVOCATION_CLEANUP_TTL_MINUTES: ${SCHEDULER_LOCK_JWT_REVOCATION_CLEANUP_TTL_MINUTES:-10}
      SECURITY_JWT_COOKIE_SECURE: ${SECURITY_JWT_COOKIE_SECURE:-false}
      SECURITY_API_DOCS_PUBLIC_ENABLED: ${SECURITY_API_DOCS_PUBLIC_ENABLED:-true}
      SECURITY_CLIENT_IP_TRUST_FORWARDED_HEADERS: ${SECURITY_CLIENT_IP_TRUST_FORWARDED_HEADERS:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hanium_dev}
      DB_USERNAME: ${DB_USERNAME:-hanium}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-2000}
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-2000}
      VIDEO_MAX_FILE_SIZE: ${VIDEO_MAX_FILE_SIZE:-500MB}
      VIDEO_MAX_REQUEST_SIZE: ${VIDEO_MAX_REQUEST_SIZE:-501MB}
      VIDEO_LLM_CHUNK_DURATION_SECONDS: ${VIDEO_LLM_CHUNK_DURATION_SECONDS:-100}
      ANALYSIS_ENGINE_BASE_URL: http://analysis-engine:8001
      VIDEO_LLM_ENGINE_BASE_URL: http://video-llm-engine:8002
      INTERNAL_ENGINE_API_KEY: ${INTERNAL_ENGINE_API_KEY:?.env에 INTERNAL_ENGINE_API_KEY를 설정하세요 (.env.example 참고). 비어 있으면 엔진이 모든 분석 요청을 401로 거절합니다.}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-15000}
      # AI 코치가 OpenAI 대신 build.nvidia.com의 무료/오픈 모델을 쓰게 하는 스위치입니다
      # (coach.llm.provider). application.yaml의 coach.llm.nvidia-api-key/-base-url이 아래
      # NVIDIA_API_KEY/NVIDIA_API_BASE_URL을 그대로 읽으므로(video-llm-engine과 동일 키
      # 재사용), 별도 COACH_LLM_NVIDIA_API_KEY 같은 env는 필요 없습니다.
      COACH_LLM_PROVIDER: ${COACH_LLM_PROVIDER:-openai}
      COACH_LLM_NVIDIA_MODEL: ${COACH_LLM_NVIDIA_MODEL:-google/diffusiongemma-26b-a4b-it}
      # 분석 피드백 생성도 같은 방식으로 대체합니다.
      FEEDBACK_LLM_PROVIDER: ${FEEDBACK_LLM_PROVIDER:-openai}
      FEEDBACK_LLM_NVIDIA_MODEL: ${FEEDBACK_LLM_NVIDIA_MODEL:-google/diffusiongemma-26b-a4b-it}
      FEEDBACK_LLM_NVIDIA_TIMEOUT_MS: ${FEEDBACK_LLM_NVIDIA_TIMEOUT_MS:-90000}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_API_BASE_URL: ${NVIDIA_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-true}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
      SMTP_READ_TIMEOUT_MS: ${SMTP_READ_TIMEOUT_MS:-10000}
      SMTP_WRITE_TIMEOUT_MS: ${SMTP_WRITE_TIMEOUT_MS:-10000}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
      PASSWORD_RESET_ENABLED: ${PASSWORD_RESET_ENABLED:-true}
      PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:-http://localhost:5173/reset-password}
      PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:-30}
      PASSWORD_RESET_OUTBOX_ENCRYPTION_KEY: ${PASSWORD_RESET_OUTBOX_ENCRYPTION_KEY:-local-password-reset-outbox-key-change-me}
      PASSWORD_RESET_OUTBOX_POLL_INTERVAL_MS: ${PASSWORD_RESET_OUTBOX_POLL_INTERVAL_MS:-5000}
      PASSWORD_RESET_OUTBOX_MAX_ATTEMPTS: ${PASSWORD_RESET_OUTBOX_MAX_ATTEMPTS:-5}
