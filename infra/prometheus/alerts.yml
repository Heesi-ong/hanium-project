# Prometheus 알림 규칙입니다.
# Alertmanager(infra/alertmanager/alertmanager.yml)와 연동되어 있어, firing된 알림은
# 설정된 이메일 수신자로 실제 발송됩니다. Prometheus UI(http://127.0.0.1:9090)의
# Alerts 탭에서도 firing 상태를 확인할 수 있습니다.

groups:
  - name: backend-alerts
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "backend가 응답하지 않습니다"
          description: "Prometheus가 backend(/actuator/prometheus)를 2분 이상 스크레이핑하지 못했습니다. 컨테이너 상태와 로그를 확인하세요."

      - alert: AnalysisWorkerDown
        # analysis-worker가 죽으면 분석 작업이 전혀 실행되지 않을 뿐 아니라, 이 프로세스가
        # 직접 노출하는 큐 백로그/DEAD_LETTER 게이지(analysis_queue_backlog,
        # storage_deletion_dead_letter, password_reset_email_dead_letter 등)도 Prometheus
        # staleness 처리로 함께 사라져 관련 알림까지 조용히 무력화된다(2026-07-31 발견:
        # analysis-worker가 3시간 넘게 다운된 상태가 사람이 직접 확인하기 전까지 감지되지
        # 않았음). 이 job은 DNS SD(dns_sd_configs)로 스크레이프되는데, 컨테이너가 완전히
        # 정지되면 Docker 내장 DNS가 해당 이름을 아예 반환하지 않아 타깃과 up 시계열
        # 자체가 사라진다 — up{...}==0만으로는 절대 안 잡힌다(2026-07-31 실측: 컨테이너를
        # 직접 정지시켜 재현, absent()를 추가하기 전까진 firing되지 않음을 확인). 단일
        # 프로세스(monolith, analysis-worker 서비스 자체가 없는) 배포에서도 동일하게
        # up 시계열이 없으므로 absent()가 필요하다.
        expr: up{job="analysis-worker"} == 0 or absent(up{job="analysis-worker"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "analysis-worker가 응답하지 않습니다"
          description: "Prometheus가 analysis-worker(/actuator/prometheus)를 2분 이상 스크레이핑하지 못했습니다. 분석 작업이 실행되지 않고 있을 수 있습니다. 컨테이너 상태와 로그를 확인하세요."

      - alert: JwtRevocationDatabaseUnavailable
        expr: |
          sum(increase(security_jwt_revocation_total{result=~"database_read_failure|database_write_failure"}[15m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "JWT 폐기 DB 원장을 사용할 수 없습니다"
          description: "토큰 폐기 상태의 DB 읽기/쓰기가 실패해 인증 요청 또는 로그아웃이 503으로 차단됐습니다. MySQL 연결과 backend 로그의 JWT_REVOCATION_UNAVAILABLE 오류를 즉시 확인하세요."

      - alert: JwtRevocationRedisCacheFailure
        expr: |
          sum(increase(security_jwt_revocation_total{result=~"redis_read_failure|redis_write_failure"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JWT 폐기 Redis 캐시가 비정상입니다"
          description: "JWT 폐기 Redis 캐시 오류가 지속돼 DB 최종 원장 fallback으로 처리 중입니다. 인증 보장은 유지되지만 DB 부하가 증가하므로 Redis 연결을 확인하세요."

      - alert: AnalysisJobFailureRateHigh
        # 최근 15분간 실패 증가량이 시작 증가량의 30%를 초과하면 발동합니다.
        # clamp_min으로 분모가 0일 때(시작된 작업이 없을 때) 나눗셈 오류를 막습니다.
        expr: increase(analysis_job_failed_total[15m]) / clamp_min(increase(analysis_job_started_total[15m]), 1) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "분석 작업 실패율이 높습니다"
          description: "최근 15분간 분석 작업 실패 비율이 30%를 초과한 상태가 5분 이상 지속되고 있습니다. analysis-engine/video-llm-engine/OpenAI 연동 상태를 확인하세요."

      - alert: OpenAiMonthlyBudgetNearExhaustion
        # 같은 예산 게이지를 backend(api)와 analysis-worker가 각자 인스턴스로 노출하므로
        # (2026-07-31 role-split 배포에서 실측 확인) max()로 묶지 않으면 job 라벨별로
        # 동일 값이 중복 발동한다.
        expr: max(openai_monthly_usage) / clamp_min(max(openai_monthly_budget_capacity), 1) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OpenAI 월간 호출 한도 소진 임박"
          description: "이번 달 OpenAI 실제 API 호출량이 설정된 한도의 90%를 초과한 상태가 5분 이상 지속되고 있습니다. 한도 상향 또는 비용을 확인하세요."

      - alert: VideoLlmMonthlyBudgetNearExhaustion
        # OpenAiMonthlyBudgetNearExhaustion과 동일한 이유로 max()로 묶는다.
        expr: max(video_llm_monthly_usage) / clamp_min(max(video_llm_monthly_budget_capacity), 1) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Video LLM 월간 호출 한도 소진 임박"
          description: "이번 달 NVIDIA Video LLM 실제 API 호출량이 설정된 한도의 90%를 초과한 상태가 5분 이상 지속되고 있습니다. 한도 상향 또는 비용을 확인하세요."

      - alert: VideoLlmFallbackRateHigh
        # DEGRADED 정책의 실제 모델 시도 중 FALLBACK 비율이 50%를 초과하면 발동합니다.
        # DISABLED 정책에서 의도적으로 생성하는 MOCK은 품질 장애가 아니므로 제외합니다.
        expr: |
          sum(increase(video_llm_generation_total{mode="FALLBACK"}[30m]))
          / clamp_min(sum(increase(video_llm_generation_total{mode=~"REAL|FALLBACK"}[30m])), 1) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Video LLM이 실제 모델 대신 mock으로 응답하는 비율이 높습니다"
          description: "최근 30분간 실제 Video LLM 시도 응답의 절반 이상이 FALLBACK입니다. NVIDIA 연동 상태, 서킷브레이커와 video-llm-engine 로그를 확인하세요. DEGRADED 정책에서 사용자에게 샘플 대체 결과가 나가고 있습니다."

      - alert: EngineReadinessDegraded
        # /status 또는 운영 점검에서 authenticated readiness가 호출됐을 때 실패 결과가 기록됩니다.
        # 실패 outcome이 10분 이상 계속 늘면 엔진 프로세스 생존 여부와 별개로 실제 분석 준비가
        # 깨진 상태일 수 있습니다.
        expr: |
          sum by (engine) (
            increase(engine_readiness_check_total{outcome=~"not_ready|unauthenticated|unreachable"}[10m])
          ) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "엔진 readiness가 degraded 상태입니다"
          description: "{{ $labels.engine }} 엔진의 authenticated readiness 점검이 실패했습니다. 내부 API 키, 모델 로딩, 외부 API 설정, 엔진 로그를 확인하세요."

      - alert: StorageDeletionDeadLetterBacklog
        # 재시도(기본 8회, 지수 백오프 최대 240분)를 모두 소진해 관리자 개입이 필요한
        # 스토리지 삭제 작업이 있다는 뜻입니다. MinIO 장애 등으로 계속 실패하면 원본
        # 파일이 삭제되지 않은 채 쌓이므로, 대시보드를 수동으로 열어보기 전에 알려야 합니다
        # (2026-07-23 운영 설정 리뷰).
        expr: storage_deletion_dead_letter > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "스토리지 삭제 작업이 DEAD_LETTER 상태로 쌓이고 있습니다"
          description: "storage_deletion_dead_letter가 10분 이상 0보다 큽니다. 관리자 대시보드에서 DEAD_LETTER 목록을 확인하고, MinIO 상태를 점검한 뒤 재큐잉하세요."

      - alert: PasswordResetEmailDeadLetterBacklog
        # 재시도를 모두 소진해 발송되지 못한 비밀번호 재설정 이메일이 있다는 뜻입니다.
        # SMTP 장애/계정 잠김 등으로 계속 실패하면 사용자가 계정을 복구할 수 없는 상태가
        # 조용히 지속될 수 있습니다(2026-07-23 운영 설정 리뷰).
        expr: password_reset_email_dead_letter > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "비밀번호 재설정 이메일이 DEAD_LETTER 상태로 쌓이고 있습니다"
          description: "password_reset_email_dead_letter가 10분 이상 0보다 큽니다. 관리자 대시보드에서 DEAD_LETTER 목록을 확인하고, SMTP 상태를 점검한 뒤 재큐잉하세요."

      - alert: ResultDataIssueDetected
        # 결과 목록/상세 조회 중 누락 영상, 누락 결과 파일, placeholder 결과가 감지되면 발동합니다.
        # 사용자가 조회하기 전까지 관측되지 않는 지표라서 1건이라도 운영자가 확인해야 합니다.
        expr: |
          sum by (issue) (
            increase(result_data_issue_total[10m])
          ) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "분석 결과 데이터 정합성 문제가 감지됐습니다"
          description: "{{ $labels.issue }} 유형의 결과 데이터 문제가 최근 조회 경로에서 감지됐습니다. jobId는 backend 로그에서 dataIssue 경고를 확인하세요."

  - name: video-processing-alerts
    rules:
      - alert: VideoDurationProbeFailOpenHigh
        # ffprobe로 영상 길이를 확인하지 못해 길이 제한을 fail-open(무조건 통과)시키는 비율이
        # 최근 30분간 30%를 넘으면 발동합니다. ffprobe 바이너리 누락/권한/코덱 문제일 수 있고,
        # 이 상태가 지속되면 VIDEO_MAX_DURATION_MINUTES(기본 30분) 제한이 사실상 무력화됩니다.
        expr: |
          sum(increase(video_duration_probe_result_total{outcome="fail_open"}[30m]))
          / clamp_min(sum(increase(video_duration_probe_result_total[30m])), 1) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ffprobe 영상 길이 확인 실패(fail-open) 비율이 높습니다"
          description: "최근 30분간 영상 길이 확인이 30% 이상 fail-open으로 통과됐습니다. backend 컨테이너에 ffprobe가 정상 설치돼 있는지, 업로드 파일이 손상되지 않았는지 확인하세요. 지속되면 영상 길이 제한이 무력화됩니다."

  - name: backup-alerts
    rules:
      - alert: MysqlBackupFailed
        expr: mysql_backup_last_run_status == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "MySQL 백업이 실패했습니다"
          description: "가장 최근 mysqldump 백업 시도가 실패한 상태가 5분 이상 지속되고 있습니다. backup 컨테이너 로그(storage/logs/backup.log)를 확인하세요."

      - alert: MysqlBackupStale
        # 기본 BACKUP_INTERVAL_HOURS=24를 기준으로, 26시간(24h + 2h 여유) 동안
        # 성공한 백업이 없으면 발동합니다. BACKUP_INTERVAL_HOURS를 바꾼 경우
        # 이 임계값(93600초)도 함께 조정하세요.
        expr: time() - mysql_backup_last_success_timestamp_seconds > 93600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "MySQL 백업이 오랫동안 성공하지 못했습니다"
          description: "가장 최근 성공한 MySQL 백업으로부터 26시간 이상 경과했습니다. backup 컨테이너가 살아있는지, mysqldump가 계속 실패하고 있는지 확인하세요."

      - alert: MysqlBackupRemoteExportFailed
        expr: mysql_backup_remote_export_last_run_status == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "MySQL 백업의 MinIO 원격 반출이 실패했습니다"
          description: "로컬 MySQL 백업은 생성됐지만 가장 최근 MinIO 원격 반출이 실패했습니다. backup 컨테이너의 MinIO 자격 증명, 버킷, 네트워크와 로그를 확인하세요."

      - alert: MysqlBackupRemoteExportStale
        # 원격 반출이 설정된 경우 마지막 성공 이후 26시간이 지나면 로컬 백업 성공 여부와
        # 별개로 발동합니다. 재해복구 사본이 장시간 갱신되지 않는 상황을 탐지합니다.
        expr: mysql_backup_remote_export_configured == 1 and time() - mysql_backup_remote_export_last_success_timestamp_seconds > 93600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "MySQL 원격 백업 사본이 오랫동안 갱신되지 않았습니다"
          description: "MinIO 원격 반출의 마지막 성공으로부터 26시간 이상 경과했습니다. 로컬 백업만 갱신되고 원격 재해복구 사본이 멈춘 것은 아닌지 확인하세요."

  - name: host-alerts
    rules:
      - alert: NodeExporterDown
        # node-exporter가 죽으면 호스트 디스크/CPU/메모리 알림뿐 아니라, textfile-collector로
        # 노출되는 mysql_backup_* 게이지(backup-alerts 그룹의 4개 규칙)까지 동시에 눈이 멀어
        # 조용히 무력화된다(2026-07-31 발견: backup 컨테이너가 8일 넘게 정체된 상태가 사람이
        # 직접 확인하기 전까지 감지되지 않았음). 여러 다운스트림 알림의 전제조건이므로
        # severity를 critical로 둔다.
        expr: up{job="node-exporter"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "node-exporter가 응답하지 않습니다"
          description: "Prometheus가 node-exporter를 5분 이상 스크레이핑하지 못했습니다. 호스트 리소스 알림과 MySQL 백업 정체 알림(textfile-collector 경유)이 함께 무력화된 상태이니 컨테이너를 즉시 확인하세요."

      - alert: HostDiskSpaceLow
        expr: node_filesystem_avail_bytes{job="node-exporter", mountpoint=~"/|/rootfs"} / clamp_min(node_filesystem_size_bytes{job="node-exporter", mountpoint=~"/|/rootfs"}, 1) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "호스트 디스크 여유 공간 부족"
          description: "호스트 루트 파일시스템의 여유 공간이 15% 미만인 상태가 10분 이상 지속되고 있습니다. storage 디렉터리와 백업/업로드 파일 사용량을 확인하세요."

      - alert: HostCpuLoadHigh
        expr: node_load1{job="node-exporter"} > (count without (cpu, mode) (node_cpu_seconds_total{job="node-exporter", mode="idle"}) * 1.5)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "호스트 CPU 부하가 높습니다"
          description: "호스트의 1분 평균 CPU 로드가 CPU 코어 수의 1.5배를 초과한 상태가 10분 이상 지속되고 있습니다. 어떤 컨테이너가 CPU를 많이 사용하는지 확인하세요."

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes{job="node-exporter"} / clamp_min(node_memory_MemTotal_bytes{job="node-exporter"}, 1) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "호스트 여유 메모리 부족"
          description: "호스트의 여유 메모리가 전체 메모리의 15% 미만인 상태가 10분 이상 지속되고 있습니다. 메모리 사용량이 높은 컨테이너와 프로세스를 확인하세요."
