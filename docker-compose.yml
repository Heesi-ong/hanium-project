      ANALYSIS_EXECUTOR_QUEUE_CAPACITY: ${ANALYSIS_EXECUTOR_QUEUE_CAPACITY:-20}
      ANALYSIS_ENGINE_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE: ${ANALYSIS_ENGINE_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:-10}
      ANALYSIS_ENGINE_CIRCUIT_BREAKER_MINIMUM_NUMBER_OF_CALLS: ${ANALYSIS_ENGINE_CIRCUIT_BREAKER_MINIMUM_NUMBER_OF_CALLS:-5}
      ANALYSIS_ENGINE_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD: ${ANALYSIS_ENGINE_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:-50}
      ANALYSIS_ENGINE_CIRCUIT_BREAKER_SLOW_CALL_DURATION_THRESHOLD: ${ANALYSIS_ENGINE_CIRCUIT_BREAKER_SLOW_CALL_DURATION_THRESHOLD:-5m}
