# 로컬 개발 전용 설정입니다. DB/Redis 등은 별도 설치 없이 바로 뜰 수 있도록
# H2 인메모리 DB를 그대로 사용합니다. (dev/prod는 MySQL + Flyway 사용, 각 yml 참고)
spring:
  datasource:
    url: jdbc:h2:mem:presentation
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
