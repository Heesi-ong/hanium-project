# 보관 자료: 이전 운영(prod) 프로필입니다.
# 현재 학생 프로젝트의 로컬/테스트 실행 범위에서는 사용하지 않습니다.
# DB_HOST/DB_NAME/DB_USERNAME/DB_PASSWORD는 기본값을 두지 않았습니다.
# 값이 없으면 서버가 아예 뜨지 않는데, 이는 실수로 잘못된(혹은 비어있는) DB에
# 연결되는 것을 막기 위한 의도된 동작입니다.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

security:
  jwt:
    # 운영 프로필은 Compose 없이 직접 실행해도 인증 쿠키가 HTTPS에서만 전송되도록 둡니다.
    cookie-secure: ${SECURITY_JWT_COOKIE_SECURE:true}
  api-docs:
    # 운영 프로필은 Compose를 거치지 않고 띄워도 API 스펙을 기본 비공개로 둡니다.
    public-enabled: ${SECURITY_API_DOCS_PUBLIC_ENABLED:false}

storage:
  object-storage:
    # 운영 다중 인스턴스에서는 새 파일이 인스턴스 로컬에만 남는 성공을 허용하지 않습니다.
    write-required: ${STORAGE_OBJECT_WRITE_REQUIRED:true}
    # API/워커가 서로 다른 로컬 디스크를 써도 결과를 조회할 수 있도록 MinIO를 먼저 읽습니다.
    read-preferred: ${STORAGE_OBJECT_READ_PREFERRED:true}

video:
  # 운영에서는 ffprobe 실패를 길이 제한 우회로 허용하지 않습니다.
  duration-probe-required: ${VIDEO_DURATION_PROBE_REQUIRED:true}
