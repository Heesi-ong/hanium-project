# docker-compose.monitoring.yml이 이 파일을 템플릿으로 읽어 환경변수를 치환한 뒤
# /tmp/alertmanager.yml로 실행합니다. 실제 값이 없으면 alertmanager 컨테이너가
# fail-fast로 종료되어, 플레이스홀더 알림 설정으로 조용히 떠 있는 상태를 막습니다.

global:
  smtp_smarthost: '__ALERT_SMTP_SMARTHOST__'
  smtp_from: '__ALERT_SMTP_FROM__'
  smtp_auth_username: '__ALERT_SMTP_USERNAME__'
  smtp_auth_password_file: '/etc/alertmanager/secrets/smtp_password'
  smtp_require_tls: true

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'email-default'

receivers:
  - name: 'email-default'
    email_configs:
      - to: '__ALERT_EMAIL_TO__'
        send_resolved: true
