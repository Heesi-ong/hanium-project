name: verify

# 이 워크플로우는 실제 디렉토리 구조(backend/frontend/analysis-engine/video-llm-engine) 기준으로
# 작성되었습니다. 파이썬 엔진(analysis-engine, video-llm-engine)에는 아직 테스트 코드가 없어서
# 우선 문법 오류만 잡는 최소 점검(compileall)만 수행합니다. 실제 pytest 테스트가 추가되면
# 이 자리에 테스트 실행 단계를 추가할 예정입니다 (서비스화 로드맵 Phase 6).

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x ./gradlew
      - run: ./gradlew test --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  python-engines:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [analysis-engine, video-llm-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # requirements.txt에 OpenCV/MediaPipe/torch 등 대용량 의존성이 있어 매번 전체 설치는
      # 비용이 크므로, 현재 단계에서는 의존성 설치 없이 문법 오류만 검사합니다.
      - run: python -m compileall -q app
        working-directory: ${{ matrix.engine }}
