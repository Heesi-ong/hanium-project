# 보관/선택 자료: 이전 상시 모니터링 설계용 오버레이입니다.
# 현재 프로젝트의 CI·완료 범위에서는 검증하지 않습니다. 기본 docker compose up에는 포함되지 않으며,
# 필요할 때만 아래 명령으로 Prometheus/Alertmanager를 함께 띄웁니다.
# 사용 예: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d prometheus alertmanager
#
# Prometheus는 같은 Docker 네트워크 안에서 backend:8081/actuator/prometheus를
# 15초 간격으로 스크레이핑합니다. UI는 호스트의 http://127.0.0.1:9090 에서만 접근 가능합니다.
# (다른 내부 서비스들과 동일하게 127.0.0.1에만 바인딩 — 외부 공개 금지)

services:
  prometheus:
    # 버전은 Docker Hub 태그 목록(last_updated 순)에서 확인한 최신 안정 릴리스입니다.
    image: prom/prometheus:v3.13.0
    restart: unless-stopped
    depends_on:
      - backend
      - alertmanager
      - blackbox-exporter
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    ports:
      - "127.0.0.1:9090:9090"

  node-exporter:
    # 버전은 Docker Hub 태그 목록(last_updated 순)에서 확인한 최신 안정 릴리스입니다.
    image: prom/node-exporter:v1.11.1
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./storage/metrics:/textfile-collector:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.textfile.directory=/textfile-collector
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    ports:
      - "127.0.0.1:9100:9100"

  cadvisor:
    # v0.53.0부터 ghcr.io/google/cadvisor로 이전된 레지스트리의 최신 안정 릴리스입니다.
    # privileged 권한이 필요하며, 컨테이너가 침해되면 호스트에 영향을 줄 수 있음을 인지하고 사용자와 상의 후 채택했습니다.
    image: ghcr.io/google/cadvisor:v0.60.3
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    ports:
      - "127.0.0.1:8085:8080"

  blackbox-exporter:
    # 엔진과 데이터 계층을 사용자 상태 페이지 호출과 무관하게 지속 점검합니다.
    # 인증정보는 넣지 않고 공개 health 또는 TCP 연결 가능 여부만 확인합니다.
    image: prom/blackbox-exporter:v0.28.0
    restart: unless-stopped
    volumes:
      - ./infra/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:9115:9115"

  grafana:
    # 버전은 Docker Hub 태그 목록(last_updated 순)에서 확인한 최신 안정 릴리스입니다.
    image: grafana/grafana:13.0.3
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      # 운영 모니터링 UI 기본 언어를 한국어로 설정합니다(로그인 화면 등 일부는 여전히 영문일 수 있음).
      GF_USERS_DEFAULT_LANGUAGE: ko-KR
    volumes:
      # 데이터소스/대시보드가 기동 시 자동 구성됩니다 (수동 설정 불필요).
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      # 사용자 설정(계정, 수동 편집 등) 보존용 데이터 볼륨입니다.
      - grafana-data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    ports:
      - "127.0.0.1:3000:3000"

  alertmanager:
    # 버전은 Docker Hub 태그 목록(last_updated 순)에서 확인한 최신 안정 릴리스입니다.
    image: prom/alertmanager:v0.33.0
    restart: unless-stopped
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.template:ro
      # SMTP 비밀번호 파일(secrets/smtp_password)을 컨테이너에서 읽습니다.
      - ./infra/alertmanager/secrets:/etc/alertmanager/secrets:ro
    environment:
      ALERT_SMTP_SMARTHOST: ${ALERT_SMTP_SMARTHOST:?ALERT_SMTP_SMARTHOST must be set}
      ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:?ALERT_SMTP_FROM must be set}
      ALERT_SMTP_USERNAME: ${ALERT_SMTP_USERNAME:?ALERT_SMTP_USERNAME must be set}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?ALERT_EMAIL_TO must be set}
    # 이미지의 기본 ENTRYPOINT(/bin/alertmanager)를 그대로 두면 아래 command가 그 뒤에
    # 인자로 붙어버려 "/bin/alertmanager /bin/sh -c ..." 형태가 되어 셸 스크립트가 아예
    # 실행되지 않는다(2026-07-31 발견: SMTP 값을 채워도 동일하게 깨짐). entrypoint를
    # 비워 command가 컨테이너의 전체 실행 커맨드가 되게 한다.
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - |
        set -e
        test -s /etc/alertmanager/secrets/smtp_password
        sed \
          -e "s|__ALERT_SMTP_SMARTHOST__|$${ALERT_SMTP_SMARTHOST}|g" \
          -e "s|__ALERT_SMTP_FROM__|$${ALERT_SMTP_FROM}|g" \
          -e "s|__ALERT_SMTP_USERNAME__|$${ALERT_SMTP_USERNAME}|g" \
          -e "s|__ALERT_EMAIL_TO__|$${ALERT_EMAIL_TO}|g" \
          /etc/alertmanager/alertmanager.yml.template > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    ports:
      - "127.0.0.1:9093:9093"

volumes:
  grafana-data:
