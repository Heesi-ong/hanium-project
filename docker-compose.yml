# 전체 서비스(mysql, redis, analysis-engine, video-llm-engine, backend, frontend)를
# 한 번에 띄우기 위한 구성입니다. 로컬 개발은 기존처럼 각 서비스를 따로 실행해도 되고,
# 이 파일로 한 번에 띄워서 "실제 배포와 비슷한 구조"를 미리 확인해볼 수도 있습니다.
#
# 사용법:
#   1) 프로젝트 루트에 .env 파일을 만들고 .env.example을 참고해 값을 채웁니다.
#   2) docker compose up --build
#
# INTERNAL_ENGINE_API_KEY 등 값을 채우지 않으면 안 되는 필수 환경변수는 ${VAR:?메시지} 문법으로
# 표시되어 있습니다. .env에 값이 없거나 비어 있으면 컨테이너가 뜨기도 전에 docker compose
# 자체가 어떤 값이 빠졌는지 알려주며 즉시 실패합니다("애매하게 나중에 실패"하는 대신).
#
# mysql/redis/analysis-engine/video-llm-engine 포트는 127.0.0.1에만 바인딩되어
# 외부 네트워크에서 접근할 수 없습니다. 완전한 운영 배포에서는 로드밸런서/방화벽에서도
# 해당 내부 포트를 외부로 전달하지 않아야 합니다.
#
# 아래 리소스 제한값은 로컬/소규모 배포 기준 기본값입니다.
# 실제 운영 서버의 CPU/메모리 용량과 모델 크기에 맞춰 조정해야 합니다.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    environment:
      MYSQL_DATABASE: ${DB_NAME:-hanium_dev}
      MYSQL_USER: ${DB_USERNAME:-hanium}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  backup:
    image: mysql:8.4
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hanium_dev}
      DB_USERNAME: ${DB_USERNAME:-hanium}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      BACKUP_DIR: /backups
      BACKUP_LOG_PATH: /logs/backup.log
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./scripts/backup-mysql.sh:/scripts/backup-mysql.sh:ro
      - ./storage/backups:/backups
      - ./storage/logs:/logs
    entrypoint:
      - /bin/bash
      - -c
      - |
        while true; do
          /bin/bash /scripts/backup-mysql.sh || echo "$(date -Iseconds) backup run failed" >> /logs/backup.log
          sleep "$((BACKUP_INTERVAL_HOURS * 3600))"
        done

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  analysis-engine:
    build:
      context: ./analysis-engine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    environment:
      INTERNAL_ENGINE_API_KEY: ${INTERNAL_ENGINE_API_KEY:?.env에 INTERNAL_ENGINE_API_KEY를 설정하세요 (.env.example 참고). 비어 있으면 엔진이 모든 분석 요청을 401로 거절합니다.}
      LOG_DIR: /storage/logs
    ports:
      - "127.0.0.1:${ANALYSIS_ENGINE_PORT:-8001}:8001"
    volumes:
      - ./storage:/storage

  video-llm-engine:
    build:
      context: ./video-llm-engine
      args:
        # mock(기본) | external-api | local-model. local-model로 바꾸면 torch/transformers
        # 등 무거운 실제 모델 스택을 설치합니다(video-llm-engine/Dockerfile 참고).
        # 현재는 mock/external-api 둘 다 실제 구현이 없어 동작은 같고, 가벼운 이미지로
        # 빌드됩니다.
        VIDEO_LLM_BACKEND: ${VIDEO_LLM_BACKEND:-mock}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          # local-model 빌드 시 실제 모델 로딩 여유를 둔 값입니다. mock/external-api
          # 빌드(기본값)는 이보다 훨씬 적은 메모리로도 충분합니다.
          memory: 6g
    environment:
      INTERNAL_ENGINE_API_KEY: ${INTERNAL_ENGINE_API_KEY:?.env에 INTERNAL_ENGINE_API_KEY를 설정하세요 (.env.example 참고). 비어 있으면 엔진이 모든 분석 요청을 401로 거절합니다.}
      VIDEO_LLM_ENABLED: ${VIDEO_LLM_ENABLED:-false}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_VIDEO_LLM_MODEL: ${NVIDIA_VIDEO_LLM_MODEL:-nvidia/nemotron-3-nano-omni-30b-a3b-reasoning}
      NVIDIA_API_BASE_URL: ${NVIDIA_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_ASSET_API_BASE_URL: ${NVIDIA_ASSET_API_BASE_URL:-https://api.nvcf.nvidia.com/v2/nvcf}
      NVIDIA_VIDEO_LLM_TIMEOUT_SECONDS: ${NVIDIA_VIDEO_LLM_TIMEOUT_SECONDS:-120}
      LOG_DIR: /storage/logs
    ports:
      - "127.0.0.1:${VIDEO_LLM_ENGINE_PORT:-8002}:8002"
    volumes:
      - ./storage:/storage

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Spring graceful shutdown(기본 30초)과 JVM/컨테이너 종료 오버헤드를 고려한 유예 시간입니다.
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      analysis-engine:
        condition: service_started
      video-llm-engine:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-presentation-coaching-local-jwt-secret-change-me-2026}
      SECURITY_JWT_EXPIRATION_MINUTES: ${SECURITY_JWT_EXPIRATION_MINUTES:-30}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hanium_dev}
      DB_USERNAME: ${DB_USERNAME:-hanium}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      ANALYSIS_ENGINE_BASE_URL: http://analysis-engine:8001
      VIDEO_LLM_ENGINE_BASE_URL: http://video-llm-engine:8002
      INTERNAL_ENGINE_API_KEY: ${INTERNAL_ENGINE_API_KEY:?.env에 INTERNAL_ENGINE_API_KEY를 설정하세요 (.env.example 참고). 비어 있으면 엔진이 모든 분석 요청을 401로 거절합니다.}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-15000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-true}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
      PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:-http://localhost:5173/reset-password}
      PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:-30}
      PASSWORD_RESET_RATE_LIMIT_CAPACITY: ${PASSWORD_RESET_RATE_LIMIT_CAPACITY:-5}
      PASSWORD_RESET_RATE_LIMIT_REFILL_MINUTES: ${PASSWORD_RESET_RATE_LIMIT_REFILL_MINUTES:-10}
      VIDEO_LLM_MONTHLY_RATE_LIMIT_CAPACITY: ${VIDEO_LLM_MONTHLY_RATE_LIMIT_CAPACITY:-500}
      VIDEO_LLM_MONTHLY_RATE_LIMIT_REFILL_MINUTES: ${VIDEO_LLM_MONTHLY_RATE_LIMIT_REFILL_MINUTES:-44640}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-8081}
      STORAGE_ROOT_PATH: /storage
      STORAGE_UPLOAD_PATH: /storage/uploads
      STORAGE_RESULT_PATH: /storage/results
      STORAGE_TEMP_PATH: /storage/temp
      STORAGE_LOG_PATH: /storage/logs
      # backend는 API 전용으로 둡니다. 실행 요청을 접수(QUEUED)만 하고, 실제 분석은
      # 아래 analysis-worker가 큐를 폴링해 처리합니다. (분리 배포)
      # 단일 프로세스(monolith)로 되돌리려면 두 값을 모두 true로 주면 됩니다.
      ANALYSIS_WORKER_ENABLED: ${BACKEND_ANALYSIS_WORKER_ENABLED:-false}
      ANALYSIS_DISPATCH_LOCAL_ON_RUN: ${BACKEND_ANALYSIS_DISPATCH_LOCAL_ON_RUN:-false}
    ports:
      - "8080:8080"
    volumes:
      - ./storage:/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # 분석 실행 전용 워커. backend와 같은 이미지를 역할만 다르게 띄웁니다.
  # HTTP 요청은 받지 않고(포트 미공개) QUEUED 작업을 폴링해 실행합니다.
  # 부하가 커지면 `docker compose up -d --scale analysis-worker=N`으로 늘릴 수 있습니다.
  # (중복 실행은 DB 낙관적 락 기반 claim으로 방지되어 안전합니다.)
  analysis-worker:
    build:
      context: ./backend
    restart: unless-stopped
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      analysis-engine:
        condition: service_started
      video-llm-engine:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-presentation-coaching-local-jwt-secret-change-me-2026}
      SECURITY_JWT_EXPIRATION_MINUTES: ${SECURITY_JWT_EXPIRATION_MINUTES:-30}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hanium_dev}
      DB_USERNAME: ${DB_USERNAME:-hanium}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      ANALYSIS_ENGINE_BASE_URL: http://analysis-engine:8001
      VIDEO_LLM_ENGINE_BASE_URL: http://video-llm-engine:8002
      INTERNAL_ENGINE_API_KEY: ${INTERNAL_ENGINE_API_KEY:?.env에 INTERNAL_ENGINE_API_KEY를 설정하세요 (.env.example 참고). 비어 있으면 엔진이 모든 분석 요청을 401로 거절합니다.}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-15000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-true}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
      PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:-http://localhost:5173/reset-password}
      PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:-30}
      PASSWORD_RESET_RATE_LIMIT_CAPACITY: ${PASSWORD_RESET_RATE_LIMIT_CAPACITY:-5}
      PASSWORD_RESET_RATE_LIMIT_REFILL_MINUTES: ${PASSWORD_RESET_RATE_LIMIT_REFILL_MINUTES:-10}
      VIDEO_LLM_MONTHLY_RATE_LIMIT_CAPACITY: ${VIDEO_LLM_MONTHLY_RATE_LIMIT_CAPACITY:-500}
      VIDEO_LLM_MONTHLY_RATE_LIMIT_REFILL_MINUTES: ${VIDEO_LLM_MONTHLY_RATE_LIMIT_REFILL_MINUTES:-44640}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-8081}
      STORAGE_ROOT_PATH: /storage
      STORAGE_UPLOAD_PATH: /storage/uploads
      STORAGE_RESULT_PATH: /storage/results
      STORAGE_TEMP_PATH: /storage/temp
      STORAGE_LOG_PATH: /storage/logs
      # 워커 역할: 실행 스케줄러 참여 + QUEUED 폴러 켜기. /run으로 즉시 투입은 하지 않음.
      ANALYSIS_WORKER_ENABLED: "true"
      ANALYSIS_WORKER_POLLER_ENABLED: "true"
      ANALYSIS_DISPATCH_LOCAL_ON_RUN: "false"
    volumes:
      - ./storage:/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    # 이 스택에서는 프론트가 VITE_API_BASE_URL(위)로 backend를 직접 호출하므로 평소엔
    # 쓰이지 않습니다. frontend 컨테이너만 따로 떼어 실행하거나(예: 다른 오케스트레이션,
    # 수동 docker run) 구성 조합이 바뀌어 /api가 frontend 컨테이너로 직접 오는 경우에도
    # API 호출이 조용히 깨지지 않도록 하는 안전망입니다(frontend/nginx.conf.template 참고).
    environment:
      BACKEND_API_UPSTREAM: backend:8080
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql-data:
