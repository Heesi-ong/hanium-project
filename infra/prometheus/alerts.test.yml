rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: video llm degraded fallback rate becomes warning
    interval: 1m
    input_series:
      - series: 'video_llm_generation_total{mode="REAL"}'
        values: 0+1x20
      - series: 'video_llm_generation_total{mode="FALLBACK"}'
        values: 0+2x20
      - series: 'video_llm_generation_total{mode="MOCK"}'
        values: 0+10x20
    alert_rule_test:
      - eval_time: 12m
        alertname: VideoLlmFallbackRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Video LLM이 실제 모델 대신 mock으로 응답하는 비율이 높습니다"
              description: "최근 30분간 실제 Video LLM 시도 응답의 절반 이상이 FALLBACK입니다. NVIDIA 연동 상태, 서킷브레이커와 video-llm-engine 로그를 확인하세요. DEGRADED 정책에서 사용자에게 샘플 대체 결과가 나가고 있습니다."

  - name: jwt revocation database failure becomes critical
    interval: 1m
    input_series:
      - series: 'security_jwt_revocation_total{result="database_read_failure"}'
        values: 0+1x10
    alert_rule_test:
      - eval_time: 3m
        alertname: JwtRevocationDatabaseUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "JWT 폐기 DB 원장을 사용할 수 없습니다"
              description: "토큰 폐기 상태의 DB 읽기/쓰기가 실패해 인증 요청 또는 로그아웃이 503으로 차단됐습니다. MySQL 연결과 backend 로그의 JWT_REVOCATION_UNAVAILABLE 오류를 즉시 확인하세요."

  - name: jwt revocation redis cache failure becomes warning
    interval: 1m
    input_series:
      - series: 'security_jwt_revocation_total{result="redis_read_failure"}'
        values: 0+1x15
    alert_rule_test:
      - eval_time: 7m
        alertname: JwtRevocationRedisCacheFailure
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "JWT 폐기 Redis 캐시가 비정상입니다"
              description: "JWT 폐기 Redis 캐시 오류가 지속돼 DB 최종 원장 fallback으로 처리 중입니다. 인증 보장은 유지되지만 DB 부하가 증가하므로 Redis 연결을 확인하세요."

  - name: storage deletion dead letter backlog becomes warning
    interval: 1m
    input_series:
      - series: storage_deletion_dead_letter
        values: 1x15
    alert_rule_test:
      - eval_time: 12m
        alertname: StorageDeletionDeadLetterBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "스토리지 삭제 작업이 DEAD_LETTER 상태로 쌓이고 있습니다"
              description: "storage_deletion_dead_letter가 10분 이상 0보다 큽니다. 관리자 대시보드에서 DEAD_LETTER 목록을 확인하고, MinIO 상태를 점검한 뒤 재큐잉하세요."

  - name: password reset email dead letter backlog becomes warning
    interval: 1m
    input_series:
      - series: password_reset_email_dead_letter
        values: 1x15
    alert_rule_test:
      - eval_time: 12m
        alertname: PasswordResetEmailDeadLetterBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "비밀번호 재설정 이메일이 DEAD_LETTER 상태로 쌓이고 있습니다"
              description: "password_reset_email_dead_letter가 10분 이상 0보다 큽니다. 관리자 대시보드에서 DEAD_LETTER 목록을 확인하고, SMTP 상태를 점검한 뒤 재큐잉하세요."

  - name: remote backup export failure becomes critical
    interval: 1m
    input_series:
      - series: mysql_backup_remote_export_last_run_status
        values: 0x10
    alert_rule_test:
      - eval_time: 6m
        alertname: MysqlBackupRemoteExportFailed
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "MySQL 백업의 MinIO 원격 반출이 실패했습니다"
              description: "로컬 MySQL 백업은 생성됐지만 가장 최근 MinIO 원격 반출이 실패했습니다. backup 컨테이너의 MinIO 자격 증명, 버킷, 네트워크와 로그를 확인하세요."

  - name: engine readiness degraded becomes warning
    interval: 1m
    input_series:
      - series: 'engine_readiness_check_total{engine="video_llm",outcome="not_ready"}'
        values: 0+1x20
    alert_rule_test:
      - eval_time: 20m
        alertname: EngineReadinessDegraded
        exp_alerts:
          - exp_labels:
              engine: video_llm
              severity: warning
            exp_annotations:
              summary: "엔진 readiness가 degraded 상태입니다"
              description: "video_llm 엔진의 authenticated readiness 점검이 실패했습니다. 내부 API 키, 모델 로딩, 외부 API 설정, 엔진 로그를 확인하세요."

  - name: result data issue becomes warning
    interval: 1m
    input_series:
      - series: 'result_data_issue_total{source="detail",issue="RESULT_DATA_INCOMPLETE"}'
        values: 0+1x10
    alert_rule_test:
      - eval_time: 10m
        alertname: ResultDataIssueDetected
        exp_alerts:
          - exp_labels:
              issue: RESULT_DATA_INCOMPLETE
              severity: warning
            exp_annotations:
              summary: "분석 결과 데이터 정합성 문제가 감지됐습니다"
              description: "RESULT_DATA_INCOMPLETE 유형의 결과 데이터 문제가 최근 조회 경로에서 감지됐습니다. jobId는 backend 로그에서 dataIssue 경고를 확인하세요."
