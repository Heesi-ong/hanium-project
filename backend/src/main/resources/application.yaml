server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: presentation-coaching-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  lifecycle:
    timeout-per-shutdown-phase: ${SERVER_SHUTDOWN_TIMEOUT_SECONDS:30}s

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # local 프로필(H2)에서는 Flyway를 쓰지 않고 Hibernate가 스키마를 자동 생성합니다.
  # dev/prod 프로필에서 true로 켭니다.
  flyway:
    enabled: false

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_SHOW_DETAILS:when-authorized}
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:presentation-coaching-local-jwt-secret-change-me-2026}
    expiration-minutes: ${SECURITY_JWT_EXPIRATION_MINUTES:30}

external:
  analysis-engine:
    base-url: ${ANALYSIS_ENGINE_BASE_URL:http://localhost:8001}
    api-key: ${INTERNAL_ENGINE_API_KEY:}

  video-llm-engine:
    base-url: ${VIDEO_LLM_ENGINE_BASE_URL:http://localhost:8002}
    api-key: ${INTERNAL_ENGINE_API_KEY:}

  # analysis-engine/video-llm-engine 호출의 connect/read 타임아웃. read 타임아웃이 한 번의
  # 외부 호출이 매달릴 수 있는 최대 시간이며, 긴 호출 도중 취소/타임아웃이 반영되는 상한이 됩니다.
  http:
    connect-timeout-seconds: ${EXTERNAL_HTTP_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-minutes: ${EXTERNAL_HTTP_READ_TIMEOUT_MINUTES:10}

resilience4j:
  circuitbreaker:
    instances:
      analysis-engine:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${ANALYSIS_ENGINE_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:10}
        minimum-number-of-calls: ${ANALYSIS_ENGINE_CIRCUIT_BREAKER_MINIMUM_NUMBER_OF_CALLS:5}
        failure-rate-threshold: ${ANALYSIS_ENGINE_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:50}
        wait-duration-in-open-state: ${ANALYSIS_ENGINE_CIRCUIT_BREAKER_WAIT_DURATION_IN_OPEN_STATE:30s}
        permitted-number-of-calls-in-half-open-state: ${ANALYSIS_ENGINE_CIRCUIT_BREAKER_HALF_OPEN_PERMITTED_CALLS:3}
        automatic-transition-from-open-to-half-open-enabled: ${ANALYSIS_ENGINE_CIRCUIT_BREAKER_AUTO_HALF_OPEN_ENABLED:true}
      video-llm-engine:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:10}
        minimum-number-of-calls: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_MINIMUM_NUMBER_OF_CALLS:5}
        failure-rate-threshold: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:50}
        wait-duration-in-open-state: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_WAIT_DURATION_IN_OPEN_STATE:30s}
        permitted-number-of-calls-in-half-open-state: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_HALF_OPEN_PERMITTED_CALLS:3}
        automatic-transition-from-open-to-half-open-enabled: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_AUTO_HALF_OPEN_ENABLED:true}

# OpenAiProperties(prefix="openai")가 실제로 읽는 키와 일치시켰습니다.
# 이전에는 external.openai.* 로 되어 있어서 값을 넣어도 바인딩되지 않는 문제가 있었습니다.
openai:
  enabled: ${OPENAI_ENABLED:false}
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  timeout-ms: ${OPENAI_TIMEOUT_MS:15000}

analysis:
  retry:
    max-count: ${ANALYSIS_RETRY_MAX_COUNT:3}
  executor:
    await-termination-seconds: ${ANALYSIS_EXECUTOR_AWAIT_TERMINATION_SECONDS:25}
  job:
    # 작업 1건의 최대 실행 시간(분). 초과 시 단계 사이 체크포인트에서 자동 실패 처리합니다.
    # 사후 복구용 stuck-job.max-running-minutes(30)보다 작게 두어, 먼저 능동적으로 종료되게 합니다.
    timeout-minutes: ${ANALYSIS_JOB_TIMEOUT_MINUTES:20}
  stuck-job:
    cron: "${ANALYSIS_STUCK_JOB_CRON:0 */10 * * * *}"
    max-running-minutes: ${ANALYSIS_STUCK_JOB_MAX_RUNNING_MINUTES:30}
  queued-job:
    resume-cron: "${ANALYSIS_QUEUED_JOB_RESUME_CRON:15 */1 * * * *}"
    stale-seconds: ${ANALYSIS_QUEUED_JOB_STALE_SECONDS:60}
  # 실행 역할(role) 분리 플래그. 기본값은 단일 프로세스(monolith)로, 지금까지의 동작과 동일합니다.
  #  - monolith(기본): worker.enabled=true, dispatch.local-on-run=true, worker.poller.enabled=false
  #  - api 전용     : worker.enabled=false, dispatch.local-on-run=false  (접수만, 실행 안 함)
  #  - worker 전용  : worker.enabled=true,  dispatch.local-on-run=false, worker.poller.enabled=true
  worker:
    # 이 인스턴스가 분석 실행/정리 스케줄러에 참여하는지. api 전용 인스턴스에서는 false.
    enabled: ${ANALYSIS_WORKER_ENABLED:true}
    poller:
      # QUEUED 작업을 DB에서 폴링해 실행하는 워커 폴러. worker 전용 인스턴스에서 true.
      enabled: ${ANALYSIS_WORKER_POLLER_ENABLED:false}
      interval-ms: ${ANALYSIS_WORKER_POLLER_INTERVAL_MS:1000}
      max-batch: ${ANALYSIS_WORKER_POLLER_MAX_BATCH:10}
  dispatch:
    # /run이 로컬 executor로 즉시 투입할지. worker/api 분리 배포에서는 false로 두고, 워커 폴러가 소비.
    local-on-run: ${ANALYSIS_DISPATCH_LOCAL_ON_RUN:true}
  queue:
    # QUEUED 백프레셔 한도. api/worker 분리 배포(dispatch.local-on-run=false)에서는 로컬 executor
    # 포화 검사가 동작하지 않으므로, 워커가 느리거나 꺼져도 DB에 무제한 쌓이지 않게 하는 유일한
    # 방어선입니다. 초과 시 /run, /retry는 429(ANALYSIS_QUEUE_FULL)로 거절합니다.
    max-global-queued: ${ANALYSIS_QUEUE_MAX_GLOBAL_QUEUED:100}
    max-queued-per-user: ${ANALYSIS_QUEUE_MAX_QUEUED_PER_USER:3}

storage:
  root-path: ${STORAGE_ROOT_PATH:../storage}
  upload-path: ${STORAGE_UPLOAD_PATH:../storage/uploads}
  result-path: ${STORAGE_RESULT_PATH:../storage/results}
  temp-path: ${STORAGE_TEMP_PATH:../storage/temp}
  log-path: ${STORAGE_LOG_PATH:../storage/logs}
  min-free-space-mb: ${STORAGE_MIN_FREE_SPACE_MB:2048}
  cleanup:
    cron: "${STORAGE_CLEANUP_CRON:0 0 * * * *}"
    temp-max-age-hours: ${STORAGE_CLEANUP_TEMP_MAX_AGE_HOURS:6}
    orphan-max-age-hours: ${STORAGE_CLEANUP_ORPHAN_MAX_AGE_HOURS:24}
  retention:
    cron: "${STORAGE_RETENTION_CRON:0 0 3 * * *}"
    original-video-days: ${STORAGE_RETENTION_ORIGINAL_VIDEO_DAYS:30}

video:
  max-duration-minutes: ${VIDEO_MAX_DURATION_MINUTES:30}

cors:
  # 쉼표로 구분된 허용 origin 목록. 배포 도메인이 생기면 코드 수정 없이 이 값만 바꾸면 됩니다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

rate-limit:
  upload:
    capacity: ${UPLOAD_RATE_LIMIT_CAPACITY:5}
    refill-minutes: ${UPLOAD_RATE_LIMIT_REFILL_MINUTES:1}
  analysis:
    capacity: ${ANALYSIS_RATE_LIMIT_CAPACITY:5}
    refill-minutes: ${ANALYSIS_RATE_LIMIT_REFILL_MINUTES:1}
  login:
    capacity: ${LOGIN_RATE_LIMIT_CAPACITY:5}
    refill-minutes: ${LOGIN_RATE_LIMIT_REFILL_MINUTES:10}
  login-ip:
    capacity: ${LOGIN_IP_RATE_LIMIT_CAPACITY:20}
    refill-minutes: ${LOGIN_IP_RATE_LIMIT_REFILL_MINUTES:10}
  signup:
    capacity: ${SIGNUP_RATE_LIMIT_CAPACITY:5}
    refill-minutes: ${SIGNUP_RATE_LIMIT_REFILL_MINUTES:10}
  openai-monthly:
    capacity: ${OPENAI_MONTHLY_RATE_LIMIT_CAPACITY:1000}
    refill-minutes: ${OPENAI_MONTHLY_RATE_LIMIT_REFILL_MINUTES:44640}

scheduler:
  lock:
    storage-cleanup-ttl-minutes: ${SCHEDULER_LOCK_STORAGE_CLEANUP_TTL_MINUTES:10}
    stuck-job-watchdog-ttl-minutes: ${SCHEDULER_LOCK_STUCK_JOB_WATCHDOG_TTL_MINUTES:5}
    original-video-retention-ttl-minutes: ${SCHEDULER_LOCK_ORIGINAL_VIDEO_RETENTION_TTL_MINUTES:10}
    queued-job-resume-ttl-minutes: ${SCHEDULER_LOCK_QUEUED_JOB_RESUME_TTL_MINUTES:2}
