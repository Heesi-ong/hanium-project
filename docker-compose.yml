      PASSWORD_RESET_OUTBOX_MAX_BACKOFF_SECONDS: ${PASSWORD_RESET_OUTBOX_MAX_BACKOFF_SECONDS:-300}
      PASSWORD_RESET_OUTBOX_CLAIM_LEASE_SECONDS: ${PASSWORD_RESET_OUTBOX_CLAIM_LEASE_SECONDS:-60}
      SCHEDULER_LOCK_PASSWORD_RESET_EMAIL_WORKER_TTL_SECONDS: ${SCHEDULER_LOCK_PASSWORD_RESET_EMAIL_WORKER_TTL_SECONDS:-4}
      LOGIN_RATE_LIMIT_CAPACITY: ${LOGIN_RATE_LIMIT_CAPACITY:-5}
      LOGIN_RATE_LIMIT_REFILL_MINUTES: ${LOGIN_RATE_LIMIT_REFILL_MINUTES:-10}
      LOGIN_IP_RATE_LIMIT_CAPACITY: ${LOGIN_IP_RATE_LIMIT_CAPACITY:-20}
      LOGIN_IP_RATE_LIMIT_REFILL_MINUTES: ${LOGIN_IP_RATE_LIMIT_REFILL_MINUTES:-10}
      SIGNUP_RATE_LIMIT_CAPACITY: ${SIGNUP_RATE_LIMIT_CAPACITY:-5}
      SIGNUP_RATE_LIMIT_REFILL_MINUTES: ${SIGNUP_RATE_LIMIT_REFILL_MINUTES:-10}
      PASSWORD_RESET_RATE_LIMIT_CAPACITY: ${PASSWORD_RESET_RATE_LIMIT_CAPACITY:-5}
      PASSWORD_RESET_RATE_LIMIT_REFILL_MINUTES: ${PASSWORD_RESET_RATE_LIMIT_REFILL_MINUTES:-10}
      PASSWORD_RESET_CONFIRM_RATE_LIMIT_CAPACITY: ${PASSWORD_RESET_CONFIRM_RATE_LIMIT_CAPACITY:-10}
      PASSWORD_RESET_CONFIRM_RATE_LIMIT_REFILL_MINUTES: ${PASSWORD_RESET_CONFIRM_RATE_LIMIT_REFILL_MINUTES:-10}
      PASSWORD_CHANGE_RATE_LIMIT_CAPACITY: ${PASSWORD_CHANGE_RATE_LIMIT_CAPACITY:-10}
      PASSWORD_CHANGE_RATE_LIMIT_REFILL_MINUTES: ${PASSWORD_CHANGE_RATE_LIMIT_REFILL_MINUTES:-10}
      VIDEO_LLM_MONTHLY_RATE_LIMIT_CAPACITY: ${VIDEO_LLM_MONTHLY_RATE_LIMIT_CAPACITY:-500}
      VIDEO_LLM_MONTHLY_RATE_LIMIT_REFILL_MINUTES: ${VIDEO_LLM_MONTHLY_RATE_LIMIT_REFILL_MINUTES:-44640}
      VIDEO_LLM_DAILY_RATE_LIMIT_CAPACITY: ${VIDEO_LLM_DAILY_RATE_LIMIT_CAPACITY:-10}
      VIDEO_LLM_DAILY_RATE_LIMIT_REFILL_MINUTES: ${VIDEO_LLM_DAILY_RATE_LIMIT_REFILL_MINUTES:-1440}
      RESULTS_QUERY_RATE_LIMIT_CAPACITY: ${RESULTS_QUERY_RATE_LIMIT_CAPACITY:-120}
      RESULTS_QUERY_RATE_LIMIT_REFILL_MINUTES: ${RESULTS_QUERY_RATE_LIMIT_REFILL_MINUTES:-1}
      VIDEO_ACCESS_TOKEN_RATE_LIMIT_CAPACITY: ${VIDEO_ACCESS_TOKEN_RATE_LIMIT_CAPACITY:-30}
      VIDEO_ACCESS_TOKEN_RATE_LIMIT_REFILL_MINUTES: ${VIDEO_ACCESS_TOKEN_RATE_LIMIT_REFILL_MINUTES:-1}
      JOB_STATUS_POLL_RATE_LIMIT_CAPACITY: ${JOB_STATUS_POLL_RATE_LIMIT_CAPACITY:-120}
      JOB_STATUS_POLL_RATE_LIMIT_REFILL_MINUTES: ${JOB_STATUS_POLL_RATE_LIMIT_REFILL_MINUTES:-1}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-8081}
      STORAGE_ROOT_PATH: /storage
      STORAGE_UPLOAD_PATH: /storage/uploads
      STORAGE_RESULT_PATH: /storage/results
      STORAGE_TEMP_PATH: /storage/temp
      STORAGE_LOG_PATH: /storage/logs
      STORAGE_OBJECT_WRITE_REQUIRED: ${STORAGE_OBJECT_WRITE_REQUIRED:-false}
      STORAGE_OBJECT_READ_PREFERRED: ${STORAGE_OBJECT_READ_PREFERRED:-false}
      STORAGE_DELETION_WORKER_CRON: ${STORAGE_DELETION_WORKER_CRON:-0 */2 * * * *}
      STORAGE_DELETION_MAX_ATTEMPTS: ${STORAGE_DELETION_MAX_ATTEMPTS:-8}
      STORAGE_DELETION_BASE_BACKOFF_MINUTES: ${STORAGE_DELETION_BASE_BACKOFF_MINUTES:-2}
      STORAGE_DELETION_MAX_BACKOFF_MINUTES: ${STORAGE_DELETION_MAX_BACKOFF_MINUTES:-240}
      STORAGE_DELETION_CLAIM_LEASE_MINUTES: ${STORAGE_DELETION_CLAIM_LEASE_MINUTES:-5}
      STORAGE_DELETION_COMPLETED_RETENTION_DAYS: ${STORAGE_DELETION_COMPLETED_RETENTION_DAYS:-30}
      STORAGE_DELETION_COMPLETED_CLEANUP_CRON: ${STORAGE_DELETION_COMPLETED_CLEANUP_CRON:-0 30 3 * * *}
      SCHEDULER_LOCK_STORAGE_DELETION_WORKER_TTL_MINUTES: ${SCHEDULER_LOCK_STORAGE_DELETION_WORKER_TTL_MINUTES:-1}
      SCHEDULER_LOCK_STORAGE_DELETION_RETENTION_TTL_MINUTES: ${SCHEDULER_LOCK_STORAGE_DELETION_RETENTION_TTL_MINUTES:-10}
      VIDEO_DURATION_PROBE_REQUIRED: ${VIDEO_DURATION_PROBE_REQUIRED:-false}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?.env에 MINIO_ROOT_USER를 설정하세요 (.env.example 참고).}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?.env에 MINIO_ROOT_PASSWORD를 설정하세요 (.env.example 참고). 8자 이상이어야 합니다.}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-hanium-storage}
      # 워커 역할: 실행 스케줄러 참여 + QUEUED 폴러 켜기. /run으로 즉시 투입은 하지 않음.
      ANALYSIS_WORKER_ENABLED: "true"
      ANALYSIS_WORKER_POLLER_ENABLED: "true"
      ANALYSIS_DISPATCH_LOCAL_ON_RUN: "false"
      ANALYSIS_EXECUTOR_CORE_POOL_SIZE: ${ANALYSIS_EXECUTOR_CORE_POOL_SIZE:-2}
      ANALYSIS_EXECUTOR_MAX_POOL_SIZE: ${ANALYSIS_EXECUTOR_MAX_POOL_SIZE:-4}
      ANALYSIS_EXECUTOR_QUEUE_CAPACITY: ${ANALYSIS_EXECUTOR_QUEUE_CAPACITY:-20}
      ANALYSIS_ENGINE_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE: ${ANALYSIS_ENGINE_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:-10}
      ANALYSIS_ENGINE_CIRCUIT_BREAKER_MINIMUM_NUMBER_OF_CALLS: ${ANALYSIS_ENGINE_CIRCUIT_BREAKER_MINIMUM_NUMBER_OF_CALLS:-5}
      ANALYSIS_ENGINE_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD: ${ANALYSIS_ENGINE_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:-50}
      ANALYSIS_ENGINE_CIRCUIT_BREAKER_SLOW_CALL_DURATION_THRESHOLD: ${ANALYSIS_ENGINE_CIRCUIT_BREAKER_SLOW_CALL_DURATION_THRESHOLD:-5m}
      ANALYSIS_ENGINE_CIRCUIT_BREAKER_SLOW_CALL_RATE_THRESHOLD: ${ANALYSIS_ENGINE_CIRCUIT_BREAKER_SLOW_CALL_RATE_THRESHOLD:-100}
      ANALYSIS_ENGINE_CIRCUIT_BREAKER_WAIT_DURATION_IN_OPEN_STATE: ${ANALYSIS_ENGINE_CIRCUIT_BREAKER_WAIT_DURATION_IN_OPEN_STATE:-30s}
      ANALYSIS_ENGINE_CIRCUIT_BREAKER_HALF_OPEN_PERMITTED_CALLS: ${ANALYSIS_ENGINE_CIRCUIT_BREAKER_HALF_OPEN_PERMITTED_CALLS:-3}
      ANALYSIS_ENGINE_CIRCUIT_BREAKER_AUTO_HALF_OPEN_ENABLED: ${ANALYSIS_ENGINE_CIRCUIT_BREAKER_AUTO_HALF_OPEN_ENABLED:-true}
      VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE:-10}
      VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_MINIMUM_NUMBER_OF_CALLS: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_MINIMUM_NUMBER_OF_CALLS:-5}
      VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:-50}
      VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_SLOW_CALL_DURATION_THRESHOLD: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_SLOW_CALL_DURATION_THRESHOLD:-9m}
      VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_SLOW_CALL_RATE_THRESHOLD: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_SLOW_CALL_RATE_THRESHOLD:-100}
      VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_WAIT_DURATION_IN_OPEN_STATE: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_WAIT_DURATION_IN_OPEN_STATE:-30s}
      VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_HALF_OPEN_PERMITTED_CALLS: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_HALF_OPEN_PERMITTED_CALLS:-3}
      VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_AUTO_HALF_OPEN_ENABLED: ${VIDEO_LLM_ENGINE_CIRCUIT_BREAKER_AUTO_HALF_OPEN_ENABLED:-true}
    volumes:
      - "${STORAGE_HOST_PATH:-./storage}:/storage"
    # backend와 같은 이유(non-root, non-privileged 포트)로 capability를 전부 제거합니다.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    # 이 스택에서는 프론트가 VITE_API_BASE_URL(위)로 backend를 직접 호출하므로 평소엔
    # 쓰이지 않습니다. frontend 컨테이너만 따로 떼어 실행하거나(예: 다른 오케스트레이션,
    # 수동 docker run) 구성 조합이 바뀌어 /api가 frontend 컨테이너로 직접 오는 경우에도
    # API 호출이 조용히 깨지지 않도록 하는 안전망입니다(frontend/nginx.conf.template 참고).
    environment:
      BACKEND_API_UPSTREAM: backend:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    # nginx는 이미지를 통째로 root로 재빌드하지 않는 한 conf.d 템플릿 치환(envsubst)과
    # 캐시/pid 파일 쓰기 때문에 완전한 non-root 전환(리스닝 포트 변경까지 필요)은 별도
    # 작업으로 미뤄뒀습니다. 대신 루트 파일시스템 자체를 읽기 전용으로 만들고, 실제로
    # 쓰기가 필요한 세 경로만 tmpfs로 열어 컨테이너 탈취 시 영구 변조를 막습니다.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d
    # master 프로세스가 root로 80번 포트를 바인딩하고, 워커 프로세스에 넘겨줄 tmpfs 캐시
    # 디렉터리 소유권을 nginx 워커 계정으로 바꿔야 해서(chown) 이 세 가지만 되돌려줍니다.
    # NET_BIND_SERVICE 없이는 포트 바인딩이, CHOWN/SETUID/SETGID 없이는 워커 프로세스로의
    # 권한 하향(master→nginx 워커 계정) 자체가 실패합니다(실제로 재현 후 확인).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mysql-data:
  minio-data:
