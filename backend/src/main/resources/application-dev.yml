# 개발 서버(dev) 프로필: MySQL + Flyway 사용.
# 로컬에서 이 프로필로 띄우려면 DB_USERNAME/DB_PASSWORD 등을 환경변수로 넘겨주세요.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hanium_dev}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:hanium}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # 스키마는 Flyway가 관리합니다. Hibernate는 스키마가 맞는지 검증만 합니다.
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
