# 전체 서비스(mysql, redis, analysis-engine, video-llm-engine, backend, frontend)를
# 한 번에 띄우기 위한 구성입니다. 로컬 개발은 기존처럼 각 서비스를 따로 실행해도 되고,
# 이 파일로 한 번에 띄워서 "실제 배포와 비슷한 구조"를 미리 확인해볼 수도 있습니다.
#
# 사용법:
#   1) 프로젝트 루트에 .env 파일을 만들고 .env.example을 참고해 값을 채웁니다.
#   2) docker compose up --build
#
# INTERNAL_ENGINE_API_KEY 등 값을 채우지 않으면 안 되는 필수 환경변수는 ${VAR:?메시지} 문법으로
# 표시되어 있습니다. .env에 값이 없거나 비어 있으면 컨테이너가 뜨기도 전에 docker compose
# 자체가 어떤 값이 빠졌는지 알려주며 즉시 실패합니다("애매하게 나중에 실패"하는 대신).
#
# mysql/redis/analysis-engine/video-llm-engine 포트는 127.0.0.1에만 바인딩되어
# 외부 네트워크에서 접근할 수 없습니다. 완전한 운영 배포에서는 로드밸런서/방화벽에서도
# 해당 내부 포트를 외부로 전달하지 않아야 합니다.
#
# 아래 리소스 제한값은 로컬/소규모 배포 기준 기본값입니다.
# 실제 운영 서버의 CPU/메모리 용량과 모델 크기에 맞춰 조정해야 합니다.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    environment:
      MYSQL_DATABASE: ${DB_NAME:-hanium_dev}
      MYSQL_USER: ${DB_USERNAME:-hanium}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u root --silent --skip-column-names -e 'SELECT 1' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backup:
    image: hanium-backup:local
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hanium_dev}
      DB_USERNAME: ${DB_USERNAME:-hanium}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      BACKUP_DIR: /backups
      BACKUP_LOG_PATH: /logs/backup.log
      BACKUP_METRICS_PATH: /metrics/mysql_backup.prom
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_FAILURE_RETRY_MINUTES: ${BACKUP_FAILURE_RETRY_MINUTES:-15}
      # 백업 암호화(선택). BACKUP_ENCRYPTION_PASSPHRASE가 비어 있으면 기존처럼 평문 백업이며,
      # 값을 채우면 .sql.gz.enc로 암호화됩니다. 원격(MinIO) 반출을 쓰면 설정을 권장합니다.
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-}
      BACKUP_ENCRYPTION_REQUIRED: ${BACKUP_ENCRYPTION_REQUIRED:-false}
      BACKUP_ENCRYPTION_PBKDF2_ITER: ${BACKUP_ENCRYPTION_PBKDF2_ITER:-200000}
      BACKUP_REMOTE_REQUIRED: ${BACKUP_REMOTE_REQUIRED:-false}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?.env에 MINIO_ROOT_USER를 설정하세요 (.env.example 참고).}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?.env에 MINIO_ROOT_PASSWORD를 설정하세요 (.env.example 참고). 8자 이상이어야 합니다.}
      MINIO_BACKUP_BUCKET_NAME: ${MINIO_BACKUP_BUCKET_NAME:-hanium-backups}
    volumes:
      - ./storage/backups:/backups
      - ./storage/logs:/logs
      - ./storage/metrics:/metrics

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
    command: ["/bin/sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli --raw ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?.env에 MINIO_ROOT_USER를 설정하세요 (.env.example 참고).}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?.env에 MINIO_ROOT_PASSWORD를 설정하세요 (.env.example 참고). 8자 이상이어야 합니다.}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?.env에 MINIO_ROOT_USER를 설정하세요 (.env.example 참고).}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?.env에 MINIO_ROOT_PASSWORD를 설정하세요 (.env.example 참고). 8자 이상이어야 합니다.}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-hanium-storage}
      MINIO_BACKUP_BUCKET_NAME: ${MINIO_BACKUP_BUCKET_NAME:-hanium-backups}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/$$MINIO_BUCKET_NAME &&
      mc mb --ignore-existing local/$$MINIO_BACKUP_BUCKET_NAME &&
      echo 'MinIO bucket ready: '$$MINIO_BUCKET_NAME' and '$$MINIO_BACKUP_BUCKET_NAME
      "

  analysis-engine:
    build:
      context: ./analysis-engine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    environment:
      INTERNAL_ENGINE_API_KEY: ${INTERNAL_ENGINE_API_KEY:?.env에 INTERNAL_ENGINE_API_KEY를 설정하세요 (.env.example 참고). 비어 있으면 엔진이 모든 분석 요청을 401로 거절합니다.}
      ANALYSIS_ENGINE_WHISPER_POOL_SIZE: ${ANALYSIS_ENGINE_WHISPER_POOL_SIZE:-2}
      ANALYSIS_ENGINE_POSE_POOL_SIZE: ${ANALYSIS_ENGINE_POSE_POOL_SIZE:-2}
      ANALYSIS_ENGINE_FACE_POOL_SIZE: ${ANALYSIS_ENGINE_FACE_POOL_SIZE:-2}
      ANALYSIS_ENGINE_MAX_VIDEO_SIZE_MB: ${ANALYSIS_ENGINE_MAX_VIDEO_SIZE_MB:-500}
      LOG_DIR: /storage/logs
    ports:
      - "127.0.0.1:${ANALYSIS_ENGINE_PORT:-8001}:8001"
    volumes:
      - ./storage:/storage
    # 사용자가 업로드한 영상을 ffmpeg/OpenCV/MediaPipe로 직접 처리하는 서비스라, 파서
    # 취약점이 나오더라도 컨테이너가 추가 권한을 얻지 못하도록 Linux capability를 전부
    # 제거합니다. non-privileged 포트(8001)만 쓰고 파일 소유권 변경 등도 필요 없어 추가로
    # 되돌려줄 capability가 없습니다.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      # 첫 실행의 Whisper/MediaPipe 모델 다운로드와 풀 프리로드 시간을 허용합니다.
      start_period: 10m

  video-llm-engine:
    build:
      context: ./video-llm-engine
      args:
        # mock(기본) | external-api | local-model. local-model로 바꾸면 torch/transformers
        # 등 무거운 실제 모델 스택을 설치합니다(video-llm-engine/Dockerfile 참고).
        # 현재는 mock/external-api 둘 다 실제 구현이 없어 동작은 같고, 가벼운 이미지로
        # 빌드됩니다.
        VIDEO_LLM_BACKEND: ${VIDEO_LLM_BACKEND:-mock}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          # local-model 빌드 시 실제 모델 로딩 여유를 둔 값입니다. mock/external-api
          # 빌드(기본값)는 이보다 훨씬 적은 메모리로도 충분합니다.
          memory: 6g
    environment:
      INTERNAL_ENGINE_API_KEY: ${INTERNAL_ENGINE_API_KEY:?.env에 INTERNAL_ENGINE_API_KEY를 설정하세요 (.env.example 참고). 비어 있으면 엔진이 모든 분석 요청을 401로 거절합니다.}
      VIDEO_LLM_ENABLED: ${VIDEO_LLM_ENABLED:-false}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_VIDEO_LLM_MODEL: ${NVIDIA_VIDEO_LLM_MODEL:-nvidia/nemotron-3-nano-omni-30b-a3b-reasoning}
      NVIDIA_API_BASE_URL: ${NVIDIA_API_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_ASSET_API_BASE_URL: ${NVIDIA_ASSET_API_BASE_URL:-https://api.nvcf.nvidia.com/v2/nvcf}
      NVIDIA_VIDEO_LLM_TIMEOUT_SECONDS: ${NVIDIA_VIDEO_LLM_TIMEOUT_SECONDS:-120}
      VIDEO_LLM_MAX_VIDEO_SIZE_MB: ${VIDEO_LLM_MAX_VIDEO_SIZE_MB:-500}
      LOG_DIR: /storage/logs
    ports:
      - "127.0.0.1:${VIDEO_LLM_ENGINE_PORT:-8002}:8002"
    volumes:
      - ./storage:/storage
    # analysis-engine과 같은 이유(신뢰할 수 없는 영상 처리)로 capability를 전부 제거합니다.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Spring graceful shutdown(기본 30초)과 JVM/컨테이너 종료 오버헤드를 고려한 유예 시간입니다.
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      analysis-engine:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      video-llm-engine:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-presentation-coaching-local-jwt-secret-change-me-2026}
      SECURITY_JWT_EXPIRATION_MINUTES: ${SECURITY_JWT_EXPIRATION_MINUTES:-30}
      SECURITY_JWT_COOKIE_SECURE: ${SECURITY_JWT_COOKIE_SECURE:-false}
      SECURITY_API_DOCS_PUBLIC_ENABLED: ${SECURITY_API_DOCS_PUBLIC_ENABLED:-true}
      SECURITY_CLIENT_IP_TRUST_FORWARDED_HEADERS: ${SECURITY_CLIENT_IP_TRUST_FORWARDED_HEADERS:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hanium_dev}
      DB_USERNAME: ${DB_USERNAME:-hanium}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      ANALYSIS_ENGINE_BASE_URL: http://analysis-engine:8001
      VIDEO_LLM_ENGINE_BASE_URL: http://video-llm-engine:8002
      INTERNAL_ENGINE_API_KEY: ${INTERNAL_ENGINE_API_KEY:?.env에 INTERNAL_ENGINE_API_KEY를 설정하세요 (.env.example 참고). 비어 있으면 엔진이 모든 분석 요청을 401로 거절합니다.}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-15000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-true}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
      PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:-http://localhost:5173/reset-password}
      PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:-30}
      PASSWORD_RESET_RATE_LIMIT_CAPACITY: ${PASSWORD_RESET_RATE_LIMIT_CAPACITY:-5}
      PASSWORD_RESET_RATE_LIMIT_REFILL_MINUTES: ${PASSWORD_RESET_RATE_LIMIT_REFILL_MINUTES:-10}
      PASSWORD_RESET_CONFIRM_RATE_LIMIT_CAPACITY: ${PASSWORD_RESET_CONFIRM_RATE_LIMIT_CAPACITY:-10}
      PASSWORD_RESET_CONFIRM_RATE_LIMIT_REFILL_MINUTES: ${PASSWORD_RESET_CONFIRM_RATE_LIMIT_REFILL_MINUTES:-10}
      VIDEO_LLM_MONTHLY_RATE_LIMIT_CAPACITY: ${VIDEO_LLM_MONTHLY_RATE_LIMIT_CAPACITY:-500}
      VIDEO_LLM_MONTHLY_RATE_LIMIT_REFILL_MINUTES: ${VIDEO_LLM_MONTHLY_RATE_LIMIT_REFILL_MINUTES:-44640}
      VIDEO_LLM_DAILY_RATE_LIMIT_CAPACITY: ${VIDEO_LLM_DAILY_RATE_LIMIT_CAPACITY:-10}
      VIDEO_LLM_DAILY_RATE_LIMIT_REFILL_MINUTES: ${VIDEO_LLM_DAILY_RATE_LIMIT_REFILL_MINUTES:-1440}
      RESULTS_QUERY_RATE_LIMIT_CAPACITY: ${RESULTS_QUERY_RATE_LIMIT_CAPACITY:-120}
      RESULTS_QUERY_RATE_LIMIT_REFILL_MINUTES: ${RESULTS_QUERY_RATE_LIMIT_REFILL_MINUTES:-1}
      VIDEO_ACCESS_TOKEN_RATE_LIMIT_CAPACITY: ${VIDEO_ACCESS_TOKEN_RATE_LIMIT_CAPACITY:-30}
      VIDEO_ACCESS_TOKEN_RATE_LIMIT_REFILL_MINUTES: ${VIDEO_ACCESS_TOKEN_RATE_LIMIT_REFILL_MINUTES:-1}
      JOB_STATUS_POLL_RATE_LIMIT_CAPACITY: ${JOB_STATUS_POLL_RATE_LIMIT_CAPACITY:-90}
      JOB_STATUS_POLL_RATE_LIMIT_REFILL_MINUTES: ${JOB_STATUS_POLL_RATE_LIMIT_REFILL_MINUTES:-1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-8081}
      STORAGE_ROOT_PATH: /storage
      STORAGE_UPLOAD_PATH: /storage/uploads
      STORAGE_RESULT_PATH: /storage/results
      STORAGE_TEMP_PATH: /storage/temp
      STORAGE_LOG_PATH: /storage/logs
      STORAGE_OBJECT_WRITE_REQUIRED: ${STORAGE_OBJECT_WRITE_REQUIRED:-false}
      STORAGE_OBJECT_READ_PREFERRED: ${STORAGE_OBJECT_READ_PREFERRED:-false}
      VIDEO_DURATION_PROBE_REQUIRED: ${VIDEO_DURATION_PROBE_REQUIRED:-false}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?.env에 MINIO_ROOT_USER를 설정하세요 (.env.example 참고).}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?.env에 MINIO_ROOT_PASSWORD를 설정하세요 (.env.example 참고). 8자 이상이어야 합니다.}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-hanium-storage}
      # 브라우저가 영상 재생 리다이렉트를 따라갈 때 접속하는 주소입니다. 위 MINIO_ENDPOINT(내부
      # Docker DNS)와 달리 호스트/브라우저에서 실제로 해석 가능해야 합니다. 운영 환경에서는
      # 반드시 실제 공개 도메인으로 바꿔야 합니다.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:${MINIO_PORT:-9000}}
      # backend는 API 전용으로 둡니다. 실행 요청을 접수(QUEUED)만 하고, 실제 분석은
      # 아래 analysis-worker가 큐를 폴링해 처리합니다. (분리 배포)
      # 단일 프로세스(monolith)로 되돌리려면 두 값을 모두 true로 주면 됩니다.
      ANALYSIS_WORKER_ENABLED: ${BACKEND_ANALYSIS_WORKER_ENABLED:-false}
      ANALYSIS_DISPATCH_LOCAL_ON_RUN: ${BACKEND_ANALYSIS_DISPATCH_LOCAL_ON_RUN:-false}
      ANALYSIS_EXECUTOR_CORE_POOL_SIZE: ${ANALYSIS_EXECUTOR_CORE_POOL_SIZE:-2}
      ANALYSIS_EXECUTOR_MAX_POOL_SIZE: ${ANALYSIS_EXECUTOR_MAX_POOL_SIZE:-4}
      ANALYSIS_EXECUTOR_QUEUE_CAPACITY: ${ANALYSIS_EXECUTOR_QUEUE_CAPACITY:-20}
    ports:
      - "8080:8080"
    volumes:
      - ./storage:/storage
    # non-root(appuser)로 실행되고 non-privileged 포트만 쓰므로 capability가 필요 없습니다.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # 분석 실행 전용 워커. backend와 같은 이미지를 역할만 다르게 띄웁니다.
  # HTTP 요청은 받지 않고(포트 미공개) QUEUED 작업을 폴링해 실행합니다.
  # 부하가 커지면 `docker compose up -d --scale analysis-worker=N`으로 늘릴 수 있습니다.
  # (중복 실행은 DB 낙관적 락 기반 claim으로 방지되어 안전합니다.)
  analysis-worker:
    build:
      context: ./backend
    restart: unless-stopped
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      analysis-engine:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      video-llm-engine:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-presentation-coaching-local-jwt-secret-change-me-2026}
      SECURITY_JWT_EXPIRATION_MINUTES: ${SECURITY_JWT_EXPIRATION_MINUTES:-30}
      SECURITY_JWT_COOKIE_SECURE: ${SECURITY_JWT_COOKIE_SECURE:-false}
      SECURITY_API_DOCS_PUBLIC_ENABLED: ${SECURITY_API_DOCS_PUBLIC_ENABLED:-true}
      SECURITY_CLIENT_IP_TRUST_FORWARDED_HEADERS: ${SECURITY_CLIENT_IP_TRUST_FORWARDED_HEADERS:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hanium_dev}
      DB_USERNAME: ${DB_USERNAME:-hanium}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      ANALYSIS_ENGINE_BASE_URL: http://analysis-engine:8001
      VIDEO_LLM_ENGINE_BASE_URL: http://video-llm-engine:8002
      INTERNAL_ENGINE_API_KEY: ${INTERNAL_ENGINE_API_KEY:?.env에 INTERNAL_ENGINE_API_KEY를 설정하세요 (.env.example 참고). 비어 있으면 엔진이 모든 분석 요청을 401로 거절합니다.}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-15000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-true}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
      PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:-http://localhost:5173/reset-password}
      PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:-30}
      PASSWORD_RESET_RATE_LIMIT_CAPACITY: ${PASSWORD_RESET_RATE_LIMIT_CAPACITY:-5}
      PASSWORD_RESET_RATE_LIMIT_REFILL_MINUTES: ${PASSWORD_RESET_RATE_LIMIT_REFILL_MINUTES:-10}
      PASSWORD_RESET_CONFIRM_RATE_LIMIT_CAPACITY: ${PASSWORD_RESET_CONFIRM_RATE_LIMIT_CAPACITY:-10}
      PASSWORD_RESET_CONFIRM_RATE_LIMIT_REFILL_MINUTES: ${PASSWORD_RESET_CONFIRM_RATE_LIMIT_REFILL_MINUTES:-10}
      VIDEO_LLM_MONTHLY_RATE_LIMIT_CAPACITY: ${VIDEO_LLM_MONTHLY_RATE_LIMIT_CAPACITY:-500}
      VIDEO_LLM_MONTHLY_RATE_LIMIT_REFILL_MINUTES: ${VIDEO_LLM_MONTHLY_RATE_LIMIT_REFILL_MINUTES:-44640}
      VIDEO_LLM_DAILY_RATE_LIMIT_CAPACITY: ${VIDEO_LLM_DAILY_RATE_LIMIT_CAPACITY:-10}
      VIDEO_LLM_DAILY_RATE_LIMIT_REFILL_MINUTES: ${VIDEO_LLM_DAILY_RATE_LIMIT_REFILL_MINUTES:-1440}
      RESULTS_QUERY_RATE_LIMIT_CAPACITY: ${RESULTS_QUERY_RATE_LIMIT_CAPACITY:-120}
      RESULTS_QUERY_RATE_LIMIT_REFILL_MINUTES: ${RESULTS_QUERY_RATE_LIMIT_REFILL_MINUTES:-1}
      VIDEO_ACCESS_TOKEN_RATE_LIMIT_CAPACITY: ${VIDEO_ACCESS_TOKEN_RATE_LIMIT_CAPACITY:-30}
      VIDEO_ACCESS_TOKEN_RATE_LIMIT_REFILL_MINUTES: ${VIDEO_ACCESS_TOKEN_RATE_LIMIT_REFILL_MINUTES:-1}
      JOB_STATUS_POLL_RATE_LIMIT_CAPACITY: ${JOB_STATUS_POLL_RATE_LIMIT_CAPACITY:-90}
      JOB_STATUS_POLL_RATE_LIMIT_REFILL_MINUTES: ${JOB_STATUS_POLL_RATE_LIMIT_REFILL_MINUTES:-1}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-8081}
      STORAGE_ROOT_PATH: /storage
      STORAGE_UPLOAD_PATH: /storage/uploads
      STORAGE_RESULT_PATH: /storage/results
      STORAGE_TEMP_PATH: /storage/temp
      STORAGE_LOG_PATH: /storage/logs
      STORAGE_OBJECT_WRITE_REQUIRED: ${STORAGE_OBJECT_WRITE_REQUIRED:-false}
      STORAGE_OBJECT_READ_PREFERRED: ${STORAGE_OBJECT_READ_PREFERRED:-false}
      VIDEO_DURATION_PROBE_REQUIRED: ${VIDEO_DURATION_PROBE_REQUIRED:-false}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?.env에 MINIO_ROOT_USER를 설정하세요 (.env.example 참고).}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?.env에 MINIO_ROOT_PASSWORD를 설정하세요 (.env.example 참고). 8자 이상이어야 합니다.}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-hanium-storage}
      # 워커 역할: 실행 스케줄러 참여 + QUEUED 폴러 켜기. /run으로 즉시 투입은 하지 않음.
      ANALYSIS_WORKER_ENABLED: "true"
      ANALYSIS_WORKER_POLLER_ENABLED: "true"
      ANALYSIS_DISPATCH_LOCAL_ON_RUN: "false"
      ANALYSIS_EXECUTOR_CORE_POOL_SIZE: ${ANALYSIS_EXECUTOR_CORE_POOL_SIZE:-2}
      ANALYSIS_EXECUTOR_MAX_POOL_SIZE: ${ANALYSIS_EXECUTOR_MAX_POOL_SIZE:-4}
      ANALYSIS_EXECUTOR_QUEUE_CAPACITY: ${ANALYSIS_EXECUTOR_QUEUE_CAPACITY:-20}
    volumes:
      - ./storage:/storage
    # backend와 같은 이유(non-root, non-privileged 포트)로 capability를 전부 제거합니다.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    # 이 스택에서는 프론트가 VITE_API_BASE_URL(위)로 backend를 직접 호출하므로 평소엔
    # 쓰이지 않습니다. frontend 컨테이너만 따로 떼어 실행하거나(예: 다른 오케스트레이션,
    # 수동 docker run) 구성 조합이 바뀌어 /api가 frontend 컨테이너로 직접 오는 경우에도
    # API 호출이 조용히 깨지지 않도록 하는 안전망입니다(frontend/nginx.conf.template 참고).
    environment:
      BACKEND_API_UPSTREAM: backend:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    # nginx는 이미지를 통째로 root로 재빌드하지 않는 한 conf.d 템플릿 치환(envsubst)과
    # 캐시/pid 파일 쓰기 때문에 완전한 non-root 전환(리스닝 포트 변경까지 필요)은 별도
    # 작업으로 미뤄뒀습니다. 대신 루트 파일시스템 자체를 읽기 전용으로 만들고, 실제로
    # 쓰기가 필요한 세 경로만 tmpfs로 열어 컨테이너 탈취 시 영구 변조를 막습니다.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d
    # master 프로세스가 root로 80번 포트를 바인딩하고, 워커 프로세스에 넘겨줄 tmpfs 캐시
    # 디렉터리 소유권을 nginx 워커 계정으로 바꿔야 해서(chown) 이 세 가지만 되돌려줍니다.
    # NET_BIND_SERVICE 없이는 포트 바인딩이, CHOWN/SETUID/SETGID 없이는 워커 프로세스로의
    # 권한 하향(master→nginx 워커 계정) 자체가 실패합니다(실제로 재현 후 확인).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mysql-data:
  minio-data:
