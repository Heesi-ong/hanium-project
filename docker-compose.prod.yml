# 보관 자료: 이전 운영 배포 설계용 오버레이입니다.
# 현재 학생 프로젝트의 실행·CI·완료 범위에는 포함하지 않으며 검증되지 않습니다.
# 사용 예: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

services:
  nginx:
    image: hanium-nginx:prod
    build:
      context: ./infra/nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT must be set for video playback CSP}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        cert_dir="/etc/letsencrypt/live/$${DOMAIN}"
        if [ ! -f "$${cert_dir}/fullchain.pem" ] || [ ! -f "$${cert_dir}/privkey.pem" ]; then
          mkdir -p "$${cert_dir}"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$${cert_dir}/privkey.pem" \
            -out "$${cert_dir}/fullchain.pem" \
            -subj "/CN=$${DOMAIN}"
          touch "$${cert_dir}/.bootstrap-self-signed"
        fi
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot-webroot:/var/www/certbot
      # 최초 기동 때 nginx가 1일짜리 self-signed 인증서를 /etc/letsencrypt에 만들고,
      # 이후 certbot이 실제 인증서로 교체합니다. read-only로 마운트하면 빈 볼륨에서
      # 첫 배포가 실패하므로 이 볼륨은 쓰기 가능해야 합니다.
      - letsencrypt:/etc/letsencrypt

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        cert_dir="/etc/letsencrypt/live/$${DOMAIN}"
        if [ -f "$${cert_dir}/.bootstrap-self-signed" ] && [ ! -f "/etc/letsencrypt/renewal/$${DOMAIN}.conf" ]; then
          rm -rf "$${cert_dir}"
        fi
        if [ ! -f "/etc/letsencrypt/renewal/$${DOMAIN}.conf" ]; then
          certbot certonly --webroot -w /var/www/certbot \
            -d "$${DOMAIN}" \
            --email "$${CERTBOT_EMAIL}" \
            --agree-tos \
            --no-eff-email
        fi
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet
          sleep 12h & wait $${!}
        done
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?CERTBOT_EMAIL must be set for Let's Encrypt}
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

  backend:
    ports: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:?SECURITY_JWT_SECRET must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT must be set}
      PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:?PASSWORD_RESET_URL_BASE must be set}
      PASSWORD_RESET_OUTBOX_ENCRYPTION_KEY: ${PASSWORD_RESET_OUTBOX_ENCRYPTION_KEY:?PASSWORD_RESET_OUTBOX_ENCRYPTION_KEY must be set}
      SECURITY_JWT_COOKIE_SECURE: "true"
      SECURITY_API_DOCS_PUBLIC_ENABLED: "false"
      SECURITY_CLIENT_IP_TRUST_FORWARDED_HEADERS: "true"
      STORAGE_OBJECT_WRITE_REQUIRED: "true"
      STORAGE_OBJECT_READ_PREFERRED: "true"
      VIDEO_DURATION_PROBE_REQUIRED: "true"

  analysis-worker:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:?SECURITY_JWT_SECRET must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      PASSWORD_RESET_OUTBOX_ENCRYPTION_KEY: ${PASSWORD_RESET_OUTBOX_ENCRYPTION_KEY:?PASSWORD_RESET_OUTBOX_ENCRYPTION_KEY must be set}
      SECURITY_JWT_COOKIE_SECURE: "true"
      SECURITY_API_DOCS_PUBLIC_ENABLED: "false"
      SECURITY_CLIENT_IP_TRUST_FORWARDED_HEADERS: "true"
      STORAGE_OBJECT_WRITE_REQUIRED: "true"
      STORAGE_OBJECT_READ_PREFERRED: "true"
      VIDEO_DURATION_PROBE_REQUIRED: "true"

  mysql:
    environment:
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}

  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}

  backup:
    environment:
      # 운영 백업은 MinIO로 원격 반출되므로 평문 덤프 생성을 허용하지 않는다.
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:?BACKUP_ENCRYPTION_PASSPHRASE must be set}
      BACKUP_ENCRYPTION_REQUIRED: "true"
      BACKUP_REMOTE_REQUIRED: "true"

  frontend:
    build:
      args:
        VITE_API_BASE_URL: ""
    ports: !reset []

volumes:
  certbot-webroot:
  letsencrypt:
