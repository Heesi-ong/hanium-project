# ==========================================================================
# 이 파일 전체는 플레이스홀더 설정입니다. 실제 배포 전 반드시 다음을 수행하세요.
#   1. smtp_smarthost / smtp_from / smtp_auth_username / receivers의 to를
#      실제 SMTP 서버와 실제 이메일 주소로 교체
#   2. infra/alertmanager/secrets/smtp_password.example을 복사해
#      infra/alertmanager/secrets/smtp_password 파일을 만들고
#      실제 SMTP 비밀번호로 채우기 (이 파일은 .gitignore로 커밋되지 않습니다)
# ==========================================================================

global:
  # 실제 배포 전 반드시 실제 SMTP 서버 주소:포트로 교체하세요.
  smtp_smarthost: 'smtp.example.com:587'
  # 실제 배포 전 반드시 실제 발신 주소로 교체하세요.
  smtp_from: 'alerts@example.com'
  # 실제 배포 전 반드시 실제 SMTP 계정으로 교체하세요.
  smtp_auth_username: 'alerts@example.com'
  # 비밀번호는 git에 커밋되지 않는 별도 파일에서 읽습니다.
  smtp_auth_password_file: '/etc/alertmanager/secrets/smtp_password'
  smtp_require_tls: true

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'email-default'

receivers:
  - name: 'email-default'
    email_configs:
      # 실제 배포 전 반드시 실제 수신자 주소로 교체하세요.
      - to: 'oncall@example.com'
        send_resolved: true
