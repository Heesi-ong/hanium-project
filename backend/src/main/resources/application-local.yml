spring:
  datasource:
    url: jdbc:h2:mem:presentation
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

spring.data.redis:
  host: localhost
  port: 6379

external:
  analysis-engine:
    base-url: http://localhost:8001

  video-llm-engine:
    base-url: http://localhost:8002

  openai:
    api-key: dummy
    model: gpt-4o-mini

storage:
  root-path: ../storage
  upload-path: ../storage/uploads
  result-path: ../storage/results
  temp-path: ../storage/temp
  log-path: ../storage/logs