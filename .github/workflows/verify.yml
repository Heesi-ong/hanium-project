name: verify

# 이 워크플로우는 실제 디렉토리 구조(backend/frontend/analysis-engine/video-llm-engine) 기준으로
# 작성되었습니다. analysis-engine은 전체 requirements 설치 후 순수 함수 테스트를 실행하고,
# video-llm-engine은 mock 엔드포인트 테스트에 필요한 최소 패키지만 설치해 pytest를 실행합니다.

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # frontend(cache: npm)/python-engines(cache: pip)와 달리 Gradle 의존성 캐시가
          # 전혀 없어서 매 CI 실행마다 전체 의존성 트리를 Maven Central에서 새로 받고
          # 있었다.
          cache: gradle
      - run: chmod +x ./gradlew
      # MinIO 통합 테스트(MinioObjectStorageIntegrationTest / ObjectStorageBackfillMinioIntegrationTest)를
      # 메인 test 실행에 포함시켜 그 커버리지가 아래 jacoco 게이트에 반영되게 한다. 예전에는
      # 게이트 이후 --tests ... --rerun-tasks로 따로 돌렸는데, --rerun-tasks가 jacoco exec를
      # 덮어써(2026-09-03 실측: 단일 클래스 재실행 후 전체 커버리지가 51/28146로 붕괴) 그
      # 실행의 커버리지가 게이트에 반영되지 못하고 폐기됐다.
      - name: Start isolated MinIO for integration tests
        run: >-
          docker run -d --name hanium-minio-integration
          -e MINIO_ROOT_USER=ci-minio-integration
          -e MINIO_ROOT_PASSWORD=ci-minio-integration-password
          -p 127.0.0.1:9000:9000
          minio/minio:RELEASE.2024-12-13T22-19-12Z
          server /data
      - name: Wait for MinIO
        run: |
          for attempt in {1..30}; do
            if docker exec hanium-minio-integration mc ready local; then
              exit 0
            fi
            sleep 1
          done
          docker logs hanium-minio-integration
          exit 1
      - name: Create MinIO integration bucket
        run: >-
          docker run --rm
          --network container:hanium-minio-integration
          -e MC_HOST_local=http://ci-minio-integration:ci-minio-integration-password@127.0.0.1:9000
          minio/mc:RELEASE.2025-08-13T08-35-41Z
          mb --ignore-existing local/hanium-storage
      - name: Run backend tests (MinIO integration included)
        # UserRateLimiterIntegrationTest(실제 Redis)는 전용 Testcontainers Redis를
        # @DynamicPropertySource로만 연결하므로 여기서 추가 서비스가 필요 없다. 공용 Redis를
        # backend job에 붙이면 IP rate limit 상태가 통합 테스트 컨텍스트 간에 공유되어 다른
        # 로그인 통합 테스트를 429로 오염시킨다(2026-09-03 실측 12건 실패).
        env:
          MINIO_INTEGRATION_TEST: "true"
          MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_PUBLIC_ENDPOINT: http://127.0.0.1:9000
          MINIO_ACCESS_KEY: ci-minio-integration
          MINIO_SECRET_KEY: ci-minio-integration-password
          MINIO_BUCKET_NAME: hanium-storage
        run: ./gradlew test --no-daemon
      - name: Require real MySQL and Redis Testcontainers execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          report = Path(
              "build/test-results/test/"
              "TEST-com.hanium.presentation.infrastructure.RealInfrastructureContainerTest.xml"
          )
          if not report.is_file():
              sys.exit(f"Testcontainers JUnit report is missing: {report}")

          suite = ET.parse(report).getroot()
          actual = {
              key: int(suite.attrib.get(key, "0"))
              for key in ("tests", "skipped", "failures", "errors")
          }
          expected = {"tests": 2, "skipped": 0, "failures": 0, "errors": 0}
          print(f"Testcontainers execution: {actual}")
          if actual != expected:
              sys.exit(
                  "CI requires both real MySQL/Redis Testcontainers tests to execute: "
                  f"expected={expected}, actual={actual}"
              )
          PY
      # coverage가 현재 수준(약 90%)보다 크게 떨어지면 빌드를 실패시킨다(P2-06).
      # 위 test 실행이 MinIO/Redis 통합 테스트까지 모두 포함하므로 이 게이트가 실제 CI가
      # 돌리는 전체 커버리지를 검증한다.
      - run: ./gradlew jacocoTestCoverageVerification --no-daemon
      - name: Upload backend test and OpenAPI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-contract-reports
          path: |
            backend/build/reports/tests/test/
            backend/build/reports/jacoco/test/
            backend/build/contracts/backend-openapi.json
          retention-days: 14
      - name: Dump MinIO logs on failure
        if: failure()
        run: docker logs hanium-minio-integration
      - name: Remove isolated MinIO
        if: always()
        run: docker rm -f hanium-minio-integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # vite.config.js의 coverage threshold를 실제 CI gate로 실행합니다.
      - run: npm run test:coverage
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/lcov.info
            frontend/coverage/index.html
          retention-days: 14
      - run: npm run build
      - run: npm run audit:dependencies
      # 공개(로그인 불필요) 페이지의 라우팅/렌더 회귀와 2026-07-16 P0 명암비 버그
      # 같은 유형을 잡는 E2E다. 백엔드 없이 프론트 dev 서버만으로 실행 가능한
      # public-flow.spec.js만 CI에서 돈다(E2E_FULL_STACK 미설정이면 로그인 필요
      # 스펙은 자체적으로 skip된다). 인증 및 실제 분석 전체 스택 검증은 아래의
      # frontend-full-stack-e2e, analysis-pipeline-e2e 전용 job에서 수행한다.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- e2e/public-flow.spec.js

  python-engines:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [analysis-engine, video-llm-engine]
        include:
          - engine: analysis-engine
            requirements-file: requirements.txt
          - engine: video-llm-engine
            # video-llm-engine은 현재 mock 중심이라, 테스트에 torch/transformers 등
            # 무거운 real-model 의존성(requirements-real-model.txt)이 필요 없습니다.
            # requirements-test.txt(=requirements-base.txt + pytest + Starlette TestClient용 HTTPX2)만 설치/감사합니다.
            requirements-file: requirements-test.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.engine }}/${{ matrix.requirements-file }}
      - run: python -m compileall -q app
        working-directory: ${{ matrix.engine }}
      # 저장소 루트에 .ruff_cache가 있어 ruff가 로컬에서는 쓰이고 있었지만 CI에는 연결돼
      # 있지 않았다. pip-audit처럼 무거운 의존성 설치 없이 바로 돌릴 수 있는 정적 검사라
      # requirements 설치보다 먼저 실행한다.
      # 버전을 반드시 고정한다 — 2026-08-03 실측: pin 없이 최신(0.16.1)을 설치하면 두
      # 엔진 모두에서 138/59건씩 새로 위반이 발생한다(ruff가 기본으로 활성화하는 규칙
      # 집합이 버전 사이에 늘어났기 때문이지, 코드가 실제로 나빠진 게 아니다). 0.12.0은
      # 현재 코드에서 위반 0건임을 확인했다.
      - run: pip install ruff==0.12.0
        working-directory: ${{ matrix.engine }}
      - run: ruff check .
        working-directory: ${{ matrix.engine }}
      - run: pip install -r ${{ matrix.requirements-file }}
        working-directory: ${{ matrix.engine }}
      - run: pip install pip-audit
        working-directory: ${{ matrix.engine }}
      - run: pip-audit --no-deps --disable-pip -r ${{ matrix.requirements-file }}
        working-directory: ${{ matrix.engine }}
      - run: pytest
        working-directory: ${{ matrix.engine }}
      - name: Export Python engine OpenAPI contract
        if: always()
        working-directory: ${{ matrix.engine }}
        run: >-
          python -c 'import json; from app.main import app;
          open("openapi.json", "w", encoding="utf-8").write(
          json.dumps(app.openapi(), ensure_ascii=False, indent=2))'
      - name: Upload Python engine coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.engine }}
          path: |
            ${{ matrix.engine }}/coverage.xml
            ${{ matrix.engine }}/htmlcov/
            ${{ matrix.engine }}/openapi.json
          retention-days: 14
      # requirements-real-model.txt(VIDEO_LLM_BACKEND=local-model 전용, torch/transformers 등)는
      # 무거워서 설치/pytest 대상에는 넣지 않지만, --disable-pip 감사는 패키지를 설치하지 않고
      # 고정된 버전만 취약점 DB와 대조하므로 여기서는 가볍게 실행할 수 있습니다. 이 파일이
      # CI 감사 사각지대로 남지 않도록(핀 고정 버전에 취약점이 생겨도 아무도 모르는 상태 방지)
      # video-llm-engine 레그에서만 추가로 감사합니다.
      - name: Audit requirements-real-model.txt (설치 없이 핀 고정 버전만 감사)
        if: matrix.engine == 'video-llm-engine'
        run: pip-audit --no-deps --disable-pip -r requirements-real-model.txt
        working-directory: video-llm-engine

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - backend
          - frontend
          - analysis-engine
          - video-llm-engine
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # backend/frontend는 이 잡 외에도 backend-boot-smoke, frontend-e2e-full-stack
      # 잡에서 각각 처음부터 다시 빌드되고 있었다(러너가 매번 새로 뜨는 GitHub-hosted
      # 러너라 로컬 레이어 캐시가 잡 간에 공유되지 않는다). scope를 이미지 이름으로 맞춰
      # GitHub Actions 캐시(type=gha)를 세 잡이 공유하게 하면, 같은 커밋에서 어느 잡이
      # 먼저 캐시를 채우든 나머지 잡은 변경되지 않은 레이어를 다시 받지 않는다.
      - name: Build image
        run: |
          docker buildx build --load \
            -t "hanium-${{ matrix.image }}:ci" \
            --cache-from "type=gha,scope=${{ matrix.image }}" \
            --cache-to "type=gha,mode=max,scope=${{ matrix.image }}" \
            "${{ matrix.image }}"
      - name: Verify service Docker contexts exclude env files
        if: matrix.image == 'backend' || matrix.image == 'frontend' || matrix.image == 'analysis-engine' || matrix.image == 'video-llm-engine'
        run: grep -qx '.env\*' "${{ matrix.image }}/.dockerignore"
      - name: Verify frontend runtime healthcheck tools
        if: matrix.image == 'frontend'
        run: >-
          docker run --rm
          --entrypoint /bin/sh
          -e BACKEND_API_UPSTREAM=backend:8080
          hanium-frontend:ci
          -c 'command -v wget && /docker-entrypoint.sh nginx -t'
      - name: Test analysis engine inside runtime image
        if: matrix.image == 'analysis-engine'
        run: >-
          docker run --rm
          --entrypoint python
          -v "$PWD/analysis-engine/tests:/app/tests:ro"
          hanium-analysis-engine:ci
          -m pytest -q
      - name: Smoke-test Video LLM runtime image
        if: matrix.image == 'video-llm-engine'
        run: >-
          docker run --rm
          --entrypoint python
          hanium-video-llm-engine:ci
          -c 'import logging, tempfile; from logging.handlers import TimedRotatingFileHandler; from app.main import app; from app.services.media_io import resolve_video_max_size_bytes; from app.core.logging_config import configure_logging; assert resolve_video_max_size_bytes() == 500 * 1024 * 1024; logger = logging.getLogger("video-llm-engine"); logger.handlers.clear(); import os; os.environ["LOG_DIR"] = tempfile.mkdtemp(); configure_logging(); handlers = [handler for handler in logger.handlers if isinstance(handler, TimedRotatingFileHandler)]; assert len(handlers) == 1; assert handlers[0].when == "MIDNIGHT"; assert handlers[0].backupCount == 30; print(app.title)'
      - name: Verify Python runtime image dependencies
        if: matrix.image == 'analysis-engine' || matrix.image == 'video-llm-engine'
        run: >-
          docker run --rm
          --entrypoint python
          hanium-${{ matrix.image }}:ci
          -m pip check
      # v0.28.0은 내부적으로 aquasecurity/setup-trivy@v0.2.1을 참조하는데 그 태그가
      # 업스트림에서 삭제되어(2026-08-03 실측) 더 이상 쓸 수 없다. v0.36.0은 같은
      # 의존성을 커밋 SHA로 고정해 참조하므로 더 안전하다.
      - name: Trivy image vulnerability scan (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hanium-${{ matrix.image }}:ci
          format: table
          exit-code: "0"
          vuln-type: os
          severity: CRITICAL,HIGH
      # 공급망 보증이 취약점 스캔뿐이라 SBOM/서명/provenance가 없었다(2026-08-03 서비스화
      # 점검 P2-06). 우선 이미지별 CycloneDX SBOM을 생성해 아티팩트로 남긴다 — 서명/provenance
      # 검증은 릴리스 파이프라인과 함께 별도로 설계해야 하는 더 큰 작업이라 이번에는 포함하지
      # 않는다. 취약점 게이트를 아직 report-only(exit-code 0)로 둔 이유도 같다: 지금
      # CRITICAL/HIGH를 바로 차단하면 이 세션에서 다루지 않은 기존 base image 취약점 때문에
      # CI 전체가 갑자기 막힐 수 있어, 먼저 현재 스캔 결과를 검토하고 예외 목록/업그레이드
      # 계획을 세운 뒤에 전환해야 한다.
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hanium-${{ matrix.image }}:ci
          format: cyclonedx
          output: sbom-${{ matrix.image }}.cdx.json
          exit-code: "0"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json
          retention-days: 30

  backend-boot-smoke:
    # docker compose config(compose-validate)는 YAML 문법만 검사하고 컨테이너를 띄우지 않아서,
    # 엔티티 매핑과 Flyway 마이그레이션이 어긋나 Hibernate schema-validation에서 기동 자체가
    # 실패하는 유형의 버그(2026-07-16에 ai_coach_messages.content에서 실제로 발생)를 잡지 못한다.
    # 이 잡은 실제 MySQL/Redis/MinIO를 띄우고 backend를 dev 프로필(ddl-auto: validate)로
    # 부팅해 컴포즈 헬스체크를 통과하는지 확인한다.
    runs-on: ubuntu-latest
    env:
      INTERNAL_ENGINE_API_KEY: ci-smoke-test-internal-key
      SECURITY_JWT_SECRET: ci-smoke-test-jwt-secret-not-a-placeholder-value
      MINIO_ROOT_USER: ci-smoke-minio-admin
      MINIO_ROOT_PASSWORD: ci-smoke-minio-password12345
      DB_PASSWORD: ci-smoke-db-password
      DB_ROOT_PASSWORD: ci-smoke-db-root-password
      REDIS_PASSWORD: ci-smoke-redis-password
      # 체크아웃 디렉터리 이름에서 파생되는 기본 프로젝트명 대신 고정값을 써서,
      # 아래 buildx로 미리 태그하는 이미지 이름과 docker compose가 기대하는
      # 이미지 이름이 항상 일치하도록 한다.
      COMPOSE_PROJECT_NAME: hanium-ci
    steps:
      - uses: actions/checkout@v4
      # ./storage:/storage 바인드 마운트가 러너의 빈 storage/ 디렉터리를 그대로
      # 노출하면 root:root 소유로 생성되어, 컨테이너 안의 non-root appuser가
      # storage/logs/backend.log에 쓰지 못해 Logback이 기동 자체를 실패시킨다
      # (2026-08-03 실측: "container is unhealthy"의 실제 원인). analysis-pipeline-e2e
      # job과 동일하게 미리 만들어 둔다.
      - name: Prepare writable runtime storage
        run: |
          mkdir -p storage/logs
          chmod -R a+rwx storage
      - uses: docker/setup-buildx-action@v3
      - name: Start database/cache/object-storage dependencies
        run: docker compose up -d --wait mysql redis minio
      - name: Create MinIO buckets
        run: docker compose up minio-init
      # docker-build 잡과 동일한 scope(backend)로 GitHub Actions 캐시를 읽고 써서,
      # 매 잡마다 처음부터 다시 빌드하지 않는다. docker compose가 기대하는 이미지
      # 이름(<project>-backend:latest)으로 직접 태그해 두면, 뒤이은
      # `docker compose up`은 이미지가 이미 있다고 보고 다시 빌드하지 않는다.
      - name: Build backend image
        run: >-
          docker buildx build --load
          -t hanium-ci-backend:latest
          --cache-from type=gha,scope=backend
          --cache-to type=gha,mode=max,scope=backend
          backend
      - name: Boot backend (dev profile) and wait for health check
        run: docker compose up -d --wait --no-deps backend
      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs backend
      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend-e2e-full-stack:
    # public-flow.spec.js(frontend job)는 백엔드 없이 도는 공개 페이지만 다룬다.
    # 로그인이 필요한 실제 흐름(auth-api.spec.js, protected-pages.spec.js)은 실제
    # backend+DB 앞에서만 의미가 있어 여기서 별도로 돈다. analysis-engine/
    # video-llm-engine/analysis-worker는 페이지 렌더링·인증 흐름 검증에는 필요
    # 없고(모델 프리로드로 기동이 매우 느려짐) backend-boot-smoke와 같은 이유로
    # --no-deps로 제외한다. 인증된 사용자 상태 API(/api/status)는 엔진이 없으면
    # 내부 세부를 노출하지 않고 사용자 영향만 "UNAVAILABLE"로 응답한다.
    runs-on: ubuntu-latest
    env:
      INTERNAL_ENGINE_API_KEY: ci-e2e-internal-key
      SECURITY_JWT_SECRET: ci-e2e-jwt-secret-not-a-placeholder-value
      MINIO_ROOT_USER: ci-e2e-minio-admin
      MINIO_ROOT_PASSWORD: ci-e2e-minio-password12345
      DB_PASSWORD: ci-e2e-db-password
      DB_ROOT_PASSWORD: ci-e2e-db-root-password
      REDIS_PASSWORD: ci-e2e-redis-password
      # docker-build/backend-boot-smoke 잡과 동일한 이유로 프로젝트명을 고정한다.
      COMPOSE_PROJECT_NAME: hanium-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # backend-boot-smoke job과 동일한 이유(2026-08-03 실측)로 미리 만들어 둔다.
      - name: Prepare writable runtime storage
        run: |
          mkdir -p storage/logs
          chmod -R a+rwx storage
      - uses: docker/setup-buildx-action@v3
      - name: Start database/cache/object-storage dependencies
        run: docker compose up -d --wait mysql redis minio
      - name: Create MinIO buckets
        run: docker compose up minio-init
      # docker-build/backend-boot-smoke 잡과 동일한 scope로 GitHub Actions 캐시를
      # 공유해 처음부터 다시 빌드하지 않는다. frontend는 docker-compose.yml의
      # VITE_API_BASE_URL 기본값(http://localhost:8080, 이 잡의 API_BASE_URL과 동일)을
      # 그대로 build arg로 넘겨 compose가 빌드했을 때와 동일한 이미지가 되게 한다.
      - name: Build backend and frontend images
        run: |
          docker buildx build --load \
            -t hanium-ci-backend:latest \
            --cache-from type=gha,scope=backend \
            --cache-to type=gha,mode=max,scope=backend \
            backend
          docker buildx build --load \
            -t hanium-ci-frontend:latest \
            --build-arg VITE_API_BASE_URL=http://localhost:8080 \
            --cache-from type=gha,scope=frontend \
            --cache-to type=gha,mode=max,scope=frontend \
            frontend
      - name: Boot backend and frontend and wait for health checks
        run: docker compose up -d --wait --no-deps backend frontend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run full-stack E2E specs
        working-directory: frontend
        env:
          E2E_FULL_STACK: "true"
          BASE_URL: http://localhost:5173
          API_BASE_URL: http://localhost:8080
        run: npm run test:e2e -- e2e/auth-api.spec.js e2e/protected-pages.spec.js
      - name: Dump backend/frontend logs on failure
        if: failure()
        run: |
          docker compose logs backend
          docker compose logs frontend
      - name: Tear down
        if: always()
        run: docker compose down -v

  analysis-pipeline-e2e:
    # 인증·페이지 렌더링 E2E와 별개로 실제 영상 업로드→DB 큐→독립 worker→
    # analysis-engine→결과/영상 토큰 조회까지 전체 비동기 파이프라인을 검증한다.
    # 외부 Video LLM/OpenAI 호출은 끄므로 벤더 키·비용·외부 API 상태에는 의존하지 않는다.
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: hanium-ci
      INTERNAL_ENGINE_API_KEY: ci-pipeline-internal-key
      SECURITY_JWT_SECRET: ci-pipeline-jwt-secret-not-a-placeholder-value
      MINIO_ROOT_USER: ci-pipeline-minio-admin
      MINIO_ROOT_PASSWORD: ci-pipeline-minio-password12345
      DB_PASSWORD: ci-pipeline-db-password
      DB_ROOT_PASSWORD: ci-pipeline-db-root-password
      REDIS_PASSWORD: ci-pipeline-redis-password
      OPENAI_ENABLED: "false"
      FEEDBACK_LLM_PROVIDER: openai
      NVIDIA_API_KEY: ""
      VIDEO_LLM_POLICY: "DISABLED"
      VIDEO_LLM_ENABLED: "false"
      ANALYSIS_ENGINE_WHISPER_POOL_SIZE: "1"
      ANALYSIS_ENGINE_POSE_POOL_SIZE: "1"
      ANALYSIS_ENGINE_FACE_POOL_SIZE: "1"
      ANALYSIS_EXECUTOR_CORE_POOL_SIZE: "1"
      ANALYSIS_EXECUTOR_MAX_POOL_SIZE: "1"
      ANALYSIS_EXECUTOR_QUEUE_CAPACITY: "5"
      # 이 job은 기준 영상 1건 + golden 2건 + 실패 복구 1건의 격리 계정을 연속 생성합니다.
      # 실제 기본 보안 한도는 유지하고 CI 스택에서만 반복 실행 여유를 둡니다.
      SIGNUP_RATE_LIMIT_CAPACITY: "20"
      LOGIN_IP_RATE_LIMIT_CAPACITY: "40"
    steps:
      - uses: actions/checkout@v4
      # 이 job은 백엔드/analysis-engine/frontend 3개 이미지 빌드 + ML 모델 캐시 + golden
      # 영상 생성을 같은 러너에서 전부 수행한다. 러너 기본 여유 공간이 이 과정에서 소진되면
      # 실제 업로드 시점에 운영과 동일한 저장 공간 안전 장치(STORAGE_MIN_FREE_SPACE_MB)가
      # 507로 정상 동작하며 막아버린다(2026-08-17 재현 확인). 안전 장치 자체를 낮추는 대신,
      # 이 job에서 쓰지 않는 사전 설치 툴체인을 정리해 여유 공간을 확보한다.
      - name: Free up runner disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/setup-buildx-action@v3
      - name: Restore analysis model cache
        uses: actions/cache@v6
        with:
          path: storage/models
          key: analysis-models-${{ runner.os }}-${{ hashFiles('analysis-engine/requirements.txt', 'analysis-engine/app/core/model_registry.py') }}
      - name: Prepare writable runtime storage
        run: |
          mkdir -p storage/uploads storage/results storage/temp storage/logs storage/models
          chmod -R a+rwx storage
      - name: Build backend, analysis engine and frontend images
        run: |
          docker buildx build --load \
            -t hanium-ci-backend:latest \
            --cache-from type=gha,scope=backend \
            --cache-to type=gha,mode=max,scope=backend \
            backend
          docker tag hanium-ci-backend:latest hanium-ci-analysis-worker:latest
          docker buildx build --load \
            -t hanium-ci-analysis-engine:latest \
            --cache-from type=gha,scope=analysis-engine \
            --cache-to type=gha,mode=max,scope=analysis-engine \
            analysis-engine
          docker buildx build --load \
            -t hanium-ci-frontend:latest \
            --cache-from type=gha,scope=frontend \
            --cache-to type=gha,mode=max,scope=frontend \
            frontend
      - name: Start database/cache/object-storage dependencies
        run: docker compose up -d --wait mysql redis minio
      - name: Create MinIO buckets
        run: docker compose up minio-init
      - name: Boot analysis engine and wait for model readiness
        run: docker compose up -d --wait --wait-timeout 900 --no-deps analysis-engine
      - name: Boot API and analysis worker
        run: docker compose up -d --wait --wait-timeout 180 --no-deps backend analysis-worker
      - name: Boot frontend and wait for health check
        run: docker compose up -d --wait --wait-timeout 120 --no-deps frontend
      - name: Install Playwright test runner
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # ubuntu-latest 러너 이미지에 ffmpeg가 포함돼 있다고 가정했으나 실제로는 없어
      # golden fixture 생성이 실패했다(2026-08-14 실측). 러너 이미지 구성에 의존하지 않도록
      # 명시적으로 설치한다.
      - name: Install ffmpeg for golden fixture generation
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Prepare deterministic golden video fixtures
        run: scripts/prepare-golden-video-fixtures.sh
      - name: Run real analysis pipeline E2E
        working-directory: frontend
        env:
          E2E_ANALYSIS_PIPELINE: "true"
          BASE_URL: http://localhost:5173
          API_BASE_URL: http://localhost:8080
          E2E_ANALYSIS_MAX_WAIT_MS: "900000"
        run: npm run test:e2e -- e2e/analysis-pipeline.spec.js
      - name: Run multi-video golden score matrix
        working-directory: frontend
        env:
          E2E_GOLDEN_MATRIX: "true"
          BASE_URL: http://localhost:5173
          API_BASE_URL: http://localhost:8080
          E2E_ANALYSIS_MAX_WAIT_MS: "900000"
        run: npm run test:e2e -- e2e/analysis-golden-matrix.spec.js
      - name: Run analysis failure and retry recovery E2E
        working-directory: frontend
        env:
          E2E_FAILURE_RECOVERY: "true"
          BASE_URL: http://localhost:5173
          API_BASE_URL: http://localhost:8080
          E2E_ANALYSIS_MAX_WAIT_MS: "900000"
        run: npm run test:e2e -- e2e/analysis-failure-recovery.spec.js
      - name: Dump pipeline service logs on failure
        if: failure()
        run: docker compose logs backend analysis-worker analysis-engine frontend mysql redis minio
      - name: Tear down
        if: always()
        run: docker compose down -v

  compose-validate:
    runs-on: ubuntu-latest
    env:
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      PASSWORD_RESET_URL_BASE: http://localhost:5173/reset-password
      PASSWORD_RESET_OUTBOX_ENCRYPTION_KEY: ci-password-reset-outbox-encryption-key-32
      SECURITY_JWT_SECRET: ci-compose-validate-jwt-secret-not-a-placeholder
      DB_PASSWORD: ci-compose-db-password
      DB_ROOT_PASSWORD: ci-compose-db-root-password
      REDIS_PASSWORD: ci-compose-redis-password
      INTERNAL_ENGINE_API_KEY: ci-compose-internal-key
      MINIO_ROOT_USER: ci-compose-minio-admin
      MINIO_ROOT_PASSWORD: ci-compose-minio-password12345
    steps:
      - uses: actions/checkout@v4
      - name: Test analysis log watcher
        run: |
          bash -n scripts/watch-analysis-logs.sh scripts/tests/test-watch-analysis-logs.sh
          bash scripts/tests/test-watch-analysis-logs.sh
      - name: Validate base compose
        run: docker compose -f docker-compose.yml config
      - name: Verify service readiness startup contract
        run: |
          docker compose -f docker-compose.yml config --format json > /tmp/base-compose.json
          docker compose -f docker-compose.yml --profile ops config --format json > /tmp/ops-compose.json
          python3 - <<'PY'
          import json

          with open('/tmp/base-compose.json', encoding='utf-8') as compose_file:
              services = json.load(compose_file)['services']

          assert 'backup' not in services, 'backup must not be part of the default local stack'

          with open('/tmp/ops-compose.json', encoding='utf-8') as compose_file:
              ops_services = json.load(compose_file)['services']
          assert ops_services['backup'].get('profiles') == ['ops'], (
              'backup must remain opt-in behind the ops profile'
          )

          readiness_dependencies = (
              'mysql',
              'redis',
              'analysis-engine',
              'minio',
              'video-llm-engine',
          )

          for dependency in readiness_dependencies:
              healthcheck = services[dependency].get('healthcheck', {})
              assert healthcheck.get('test'), f'{dependency} healthcheck is missing'

          frontend_healthcheck = services['frontend'].get('healthcheck', {})
          assert frontend_healthcheck.get('test'), 'frontend healthcheck is missing'

          for consumer in ('backend', 'analysis-worker'):
              dependencies = services[consumer].get('depends_on', {})
              for dependency in readiness_dependencies:
                  condition = dependencies.get(dependency, {}).get('condition')
                  assert condition == 'service_healthy', (
                      f'{consumer} must wait for {dependency} service_healthy, got {condition!r}'
                  )

          storage_deletion_settings = (
              'STORAGE_DELETION_WORKER_CRON',
              'STORAGE_DELETION_MAX_ATTEMPTS',
              'STORAGE_DELETION_BASE_BACKOFF_MINUTES',
              'STORAGE_DELETION_MAX_BACKOFF_MINUTES',
              'STORAGE_DELETION_CLAIM_LEASE_MINUTES',
              'STORAGE_DELETION_COMPLETED_RETENTION_DAYS',
              'STORAGE_DELETION_COMPLETED_CLEANUP_CRON',
              'SCHEDULER_LOCK_STORAGE_DELETION_WORKER_TTL_MINUTES',
              'SCHEDULER_LOCK_STORAGE_DELETION_RETENTION_TTL_MINUTES',
          )
          backend_environment = services['backend'].get('environment', {})
          worker_environment = services['analysis-worker'].get('environment', {})
          for setting in storage_deletion_settings:
              assert setting in backend_environment, f'backend is missing {setting}'
              assert setting in worker_environment, f'analysis-worker is missing {setting}'
              assert backend_environment[setting] == worker_environment[setting], (
                  f'{setting} must match across backend and analysis-worker'
              )

          password_reset_outbox_settings = (
              'PASSWORD_RESET_OUTBOX_ENCRYPTION_KEY',
              'PASSWORD_RESET_OUTBOX_POLL_INTERVAL_MS',
              'PASSWORD_RESET_OUTBOX_MAX_ATTEMPTS',
              'PASSWORD_RESET_OUTBOX_BASE_BACKOFF_SECONDS',
              'PASSWORD_RESET_OUTBOX_MAX_BACKOFF_SECONDS',
              'PASSWORD_RESET_OUTBOX_CLAIM_LEASE_SECONDS',
              'SCHEDULER_LOCK_PASSWORD_RESET_EMAIL_WORKER_TTL_SECONDS',
              'SMTP_CONNECTION_TIMEOUT_MS',
              'SMTP_READ_TIMEOUT_MS',
              'SMTP_WRITE_TIMEOUT_MS',
          )
          for setting in password_reset_outbox_settings:
              assert setting in backend_environment, f'backend is missing {setting}'
              assert setting in worker_environment, f'analysis-worker is missing {setting}'
              assert backend_environment[setting] == worker_environment[setting], (
                  f'{setting} must match across backend and analysis-worker'
              )

          jwt_revocation_settings = (
              'JWT_REVOCATION_CLEANUP_CRON',
              'SCHEDULER_LOCK_JWT_REVOCATION_CLEANUP_TTL_MINUTES',
          )
          for setting in jwt_revocation_settings:
              assert setting in backend_environment, f'backend is missing {setting}'
              assert setting in worker_environment, f'analysis-worker is missing {setting}'
              assert backend_environment[setting] == worker_environment[setting], (
                  f'{setting} must match across backend and analysis-worker'
              )

          analysis_engine_settings = (
              'INTERNAL_ENGINE_API_KEY',
              'ANALYSIS_ENGINE_WHISPER_POOL_SIZE',
              'ANALYSIS_ENGINE_POSE_POOL_SIZE',
              'ANALYSIS_ENGINE_FACE_POOL_SIZE',
              'ANALYSIS_ENGINE_MAX_VIDEO_SIZE_MB',
              'ANALYSIS_ENGINE_WHISPER_TRANSCRIBE_TIMEOUT_SECONDS',
              'ANALYSIS_ENGINE_ALLOWED_DOWNLOAD_HOSTS',
              'ANALYSIS_ENGINE_ALLOWED_VIDEO_BASE_DIR',
              'LOG_DIR',
          )
          analysis_engine_environment = services['analysis-engine'].get('environment', {})
          for setting in analysis_engine_settings:
              assert setting in analysis_engine_environment, (
                  f'analysis-engine is missing validated setting {setting}'
              )

          video_llm_engine_settings = (
              'INTERNAL_ENGINE_API_KEY',
              'VIDEO_LLM_POLICY',
              'VIDEO_LLM_ENABLED',
              'VIDEO_LLM_BACKEND',
              'NVIDIA_API_KEY',
              'NVIDIA_VIDEO_LLM_MODEL',
              'NVIDIA_API_BASE_URL',
              'NVIDIA_ASSET_API_BASE_URL',
              'NVIDIA_VIDEO_LLM_TIMEOUT_SECONDS',
              'VIDEO_LLM_MAX_VIDEO_SIZE_MB',
              'VIDEO_LLM_ALLOWED_VIDEO_BASE_DIR',
              'VIDEO_LLM_ALLOWED_DOWNLOAD_HOSTS',
              'VIDEO_LLM_REAL_MODEL_MAX_CONCURRENCY',
              'VIDEO_LLM_REAL_MODEL_SEMAPHORE_TIMEOUT_SECONDS',
              'VIDEO_LLM_CHUNK_DURATION_SECONDS',
              'VIDEO_LLM_SEGMENT_SPLIT_TIMEOUT_SECONDS',
              'VIDEO_LLM_MAX_DURATION_SECONDS',
              'LOG_DIR',
          )
          video_llm_environment = services['video-llm-engine'].get('environment', {})
          for setting in video_llm_engine_settings:
              assert setting in video_llm_environment, (
                  f'video-llm-engine is missing validated setting {setting}'
              )

          frontend_backend_condition = services['frontend']['depends_on'].get('backend', {}).get('condition')
          assert frontend_backend_condition == 'service_healthy', (
              f'frontend must wait for backend service_healthy, got {frontend_backend_condition!r}'
          )

          for consumer in ('backend', 'analysis-worker'):
              condition = services[consumer]['depends_on'].get('minio-init', {}).get('condition')
              assert condition == 'service_completed_successfully', (
                  f'{consumer} must wait for minio-init completion, got {condition!r}'
              )

          print('Service readiness startup contract OK')
          PY
      - name: Validate k6 load-test script
        run: >-
          docker run --rm
          -v "$PWD:/workspace:ro"
          -w /workspace/scripts/load-test
          grafana/k6:2.1.0
          inspect upload-analyze.js
