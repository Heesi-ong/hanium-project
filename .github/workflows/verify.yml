name: verify

# 이 워크플로우는 실제 디렉토리 구조(backend/frontend/analysis-engine/video-llm-engine) 기준으로
# 작성되었습니다. analysis-engine은 전체 requirements 설치 후 순수 함수 테스트를 실행하고,
# video-llm-engine은 mock 엔드포인트 테스트에 필요한 최소 패키지만 설치해 pytest를 실행합니다.

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x ./gradlew
      - run: ./gradlew test --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  python-engines:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [analysis-engine, video-llm-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.engine }}/requirements.txt
      - run: python -m compileall -q app
        working-directory: ${{ matrix.engine }}
      - if: matrix.engine == 'analysis-engine'
        run: pip install -r requirements.txt
        working-directory: ${{ matrix.engine }}
      - if: matrix.engine == 'video-llm-engine'
        run: pip install pytest==8.4.2 fastapi==0.138.2 httpx==0.28.1 pydantic==2.13.4
        working-directory: ${{ matrix.engine }}
      - if: matrix.engine == 'analysis-engine'
        run: pytest
        working-directory: ${{ matrix.engine }}
      - if: matrix.engine == 'video-llm-engine'
        run: pytest
        working-directory: ${{ matrix.engine }}
